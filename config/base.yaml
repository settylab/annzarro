# Annzarro Base Configuration
# This file contains common settings shared across all environments

# Server configuration
server:
  # Network settings
  host: 127.0.0.1
  port: 8000
  unified_server: true
  
  # API configuration
  cors_enabled: false
  cors_origins: "*"
  
  # HTTPS settings (enabled in production)
  https_enabled: false
  cert_file: null
  key_file: null
  
  # Proxy settings
  proxy_count: 0
  
  # Data storage
  data_dir: "data"
  
  # Logging configuration
  log_file: "logs/annzarro_server.log"
  log_level: "INFO"
  
  # Rate limiting and protection
  max_response_elements: 10000000
  max_cells_per_request: 10000000
  max_genes_per_request: 1000000
  max_embedding_dims: 200
  
  # Caching configuration
  cache_enabled: true
  cache_memory_mb: 1000
  cache_dataset_limit: 10

  # Remote datasets (s3://, gs://, http(s):// zarr stores; needs annzarro[remote])
  # A remote dataset path makes the server fetch a URL chosen by the client.
  #   auto  - allowed on a local single-user server (loopback host, no auth,
  #           no proxy); otherwise only URLs under remote_allowlist
  #   allow - always allowed (restricted to remote_allowlist if it is set)
  #   deny  - never
  remote_stores: auto
  remote_allowlist: []  # e.g. ["s3://my-lab-bucket/atlases/", "https://data.example.org/zarr/"]
  # anonymous   - unsigned requests (public buckets / plain HTTP)
  # environment - backend credential chain: AWS_* env vars, AWS_PROFILE/~/.aws,
  #               instance roles; Google application default credentials
  remote_credentials: anonymous

# Authentication configuration
auth:
  user_file: "config/auth/users.json"  # Dedicated auth directory in config - visible but protected
  secret_key: "change-this-in-production"  # Will be overridden in production
  #enabled: true

# Application branding
branding:
  app_name: "Annzarro"
  project_description: "Zarr-based AnnData Visualization Tool"
  
  # Contact information shown on login page
  contact_info:
    lab_name: "Setty Lab"
    lab_url: "https://setty-lab.org"
    email: "dotto@fredhutch.org"
    custom_html: null

# UI configuration
ui:
  # Panel type settings
  enabled_panel_types:
    - cell-plot
    - gene-plot
    - cell-table
    - gene-table
    # - gene-set  # Uncomment to enable gene set analysis
  
  # Default visualization settings
  defaults:
    max_cells: 1000000
    max_genes: 1000000
    point_size: 5
    point_opacity: 1.0
    color_scale: "Portland"
    taxonomy_id: "9606"  # Homo sapiens

  # Client-side cache configuration
  cache:
    max_entries: 1000
    max_size_mb: 1024  # ~1GB
    
  # Autosave configuration
  autosave:
    enabled: true
    interval_ms: 10000
    storage_key: "annzarro_autosave"
    session_name: "Autosave"
    show_in_list: false
    auto_restore: true

# External API integrations
integrations:
  string_db:
    base_url: "https://string-db.org/api"
    version: "11.5"
