<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Path the app is mounted at behind a reverse proxy ("" at the root); see static/js/utils/app-url.js -->
    <meta name="annzarro-root" content="{{ request.script_root }}">
    <title>{{ app_name|default('AnnZarro') }} - {{ project_description|default('Zarr-based AnnData Visualization') }}</title>
    
    <!-- Favicons -->
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" type="image/x-icon">
    <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.ico') }}" type="image/x-icon">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
    
    <!-- External Dependencies (local for offline use) -->
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/css/bootstrap.min.css') }}">
    
    <!-- DataTables CSS Files (Bootstrap 5 styling) -->
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/css/dataTables.bootstrap5.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/css/buttons.bootstrap5.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/css/searchBuilder.bootstrap5.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/css/select.bootstrap5.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/css/fixedHeader.bootstrap5.min.css') }}">
    
    <!-- Font Awesome and Select2 -->
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/css/all.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/css/select2.min.css') }}">

    <!-- FontAwesome webfont paths -->
    <style>
        @font-face {
            font-family: 'Font Awesome 6 Free';
            font-style: normal;
            font-weight: 900;
            font-display: block;
            src: url("{{ url_for('static', filename='vendor/webfonts/fa-solid-900.woff2') }}") format("woff2");
        }
        @font-face {
            font-family: 'Font Awesome 6 Free';
            font-style: normal;
            font-weight: 400;
            font-display: block;
            src: url("{{ url_for('static', filename='vendor/webfonts/fa-regular-400.woff2') }}") format("woff2");
        }
        @font-face {
            font-family: 'Font Awesome 6 Brands';
            font-style: normal;
            font-weight: 400;
            font-display: block;
            src: url("{{ url_for('static', filename='vendor/webfonts/fa-brands-400.woff2') }}") format("woff2");
        }
        @font-face {
            font-family: 'Font Awesome 6 Free';
            font-style: normal;
            font-weight: 900;
            font-display: block;
            src: url("{{ url_for('static', filename='vendor/webfonts/fa-v4compatibility.woff2') }}") format("woff2");
        }
    </style>
    
    <!-- Custom Styles -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <!-- Top Bar with Global Controls -->
    <header id="app-header" class="app-header">
        <div class="container-fluid">
            <div class="row align-items-center">
                <div class="col-auto">
                    <h1 class="app-title">{{ app_name|default('AnnZarro') }}</h1>
                    <a id="auth-indicator" class="auth-indicator" hidden></a>
                </div>
                <div class="col">
                    <div class="global-controls">
                        <div class="row align-items-center">
                            <div class="col">
                                <label for="dataset-selector">Dataset:</label>
                                <div class="d-flex">
                                    <select id="dataset-selector" class="form-select" data-allow-custom="true">
                                        <option value="">Loading..</option>
                                    </select>
                                    <button id="refresh-dataset" class="btn btn-outline-secondary ms-1" title="Refresh dataset">
                                        <i class="fas fa-sync-alt"></i>
                                    </button>
                                    <button id="select-directory" class="btn btn-outline-secondary ms-1" title="Select directory" style="display: none;">
                                        <i class="fas fa-folder-open"></i>
                                    </button>
                                    <button id="btn-change-dataset" class="btn btn-outline-warning ms-1" title="Choose the dataset this view opens on" hidden>
                                        <i class="fas fa-exchange-alt"></i> <span class="btn-label">Change dataset</span>
                                    </button>
                                </div>
                            </div>
                            <div class="col">
                                <label for="focused-gene">Focused Gene:</label>
                                <div class="d-flex">
                                    <div class="btn-group btn-group-sm me-1">
                                        <button id="gene-history-back" class="btn btn-outline-secondary" title="Previous gene" disabled>
                                            <i class="fas fa-chevron-left"></i>
                                        </button>
                                        <button id="gene-history-forward" class="btn btn-outline-secondary" title="Next gene" disabled>
                                            <i class="fas fa-chevron-right"></i>
                                        </button>
                                    </div>
                                    <div class="flex-grow-1"><input id="focused-gene" class="form-control" type="text" placeholder="Search genes" aria-label="Focused gene"></div>
                                </div>
                            </div>
                            <div class="col">
                                <label for="focused-cell">Focused Cell:</label>
                                <div class="d-flex">
                                    <div class="btn-group btn-group-sm me-1">
                                        <button id="cell-history-back" class="btn btn-outline-secondary" title="Previous cell" disabled>
                                            <i class="fas fa-chevron-left"></i>
                                        </button>
                                        <button id="cell-history-forward" class="btn btn-outline-secondary" title="Next cell" disabled>
                                            <i class="fas fa-chevron-right"></i>
                                        </button>
                                    </div>
                                    <div class="flex-grow-1"><input id="focused-cell" class="form-control" type="text" placeholder="Search cells" aria-label="Focused cell"></div>
                                    <span id="focused-cell-outside" class="badge focus-outside-badge" hidden>not shown</span>
                                </div>
                            </div>
                            <div class="col-auto header-actions">
                                <div class="btn-group">
                                    <button id="btn-save-session" class="btn btn-primary" title="Save Panel Set"><i class="fas fa-save"></i> <span class="btn-label">Save Panel Set</span></button>
                                    <button id="btn-load-session" class="btn btn-secondary" title="Load Panel Set"><i class="fas fa-folder-open"></i> <span class="btn-label">Load Panel Set</span></button>
                                    <button id="btn-close-all" class="btn btn-outline-secondary" title="Close all panels"><i class="fas fa-times-circle"></i> <span class="btn-label">Close all</span></button>
                                    <button id="btn-share-link" class="btn btn-outline-secondary" title="Copy a link that reopens this dataset, layout and focus"><i class="fas fa-link"></i> <span class="btn-label btn-share-label">Share Link</span></button>
                                </div>
                                <!-- Shown only when the clipboard is unavailable (e.g. plain http on a cluster node) -->
                                <div id="share-link-fallback" class="share-link-fallback input-group input-group-sm mt-1" hidden>
                                    <input id="share-link-field" type="text" class="form-control" readonly aria-label="Shareable link">
                                    <button id="share-link-close" class="btn btn-outline-secondary" type="button" title="Close"><i class="fas fa-times"></i></button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </header>
    
    <!-- Dataset Stats Bar -->
    <div id="dataset-stats" class="dataset-stats">
        <div class="container-fluid">
            <div class="row">
                <div class="col-md-3">
                    <span>Cells: <span id="cell-count">-</span></span>
                    <button id="subset-button" type="button" class="btn btn-sm subset-badge" hidden>All cells</button>
                    <span id="subset-parts" class="subset-parts" hidden>
                        <button id="subset-part-prev" type="button" class="btn btn-sm subset-part-step" aria-label="Previous part" title="Previous part">&lsaquo;</button>
                        <label class="subset-part-label">Part <input id="subset-part-input" type="number" min="1" step="1" class="subset-part-input" aria-label="Part number"> of <span id="subset-part-count">-</span></label>
                        <button id="subset-part-next" type="button" class="btn btn-sm subset-part-step" aria-label="Next part" title="Next part">&rsaquo;</button>
                    </span>
                </div>
                <div class="col-md-3">
                    <span>Genes: <span id="gene-count">-</span></span>
                </div>
                <div class="col-md-6">
                    <span>Dataset: <span id="dataset-path">-</span></span>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Main Content Area - Tile Container -->
    <main id="tile-container" class="tile-container">
        <!-- Tiles will be dynamically added here -->
    </main>
    
    <!-- We're removing the footer as we'll add tile creation in the layout manager -->
    
    <!-- Templates -->
    <template id="tile-template">
        <div class="tile" data-tile-id="">
            <div class="tile-header">
                <input type="text" class="tile-title" value="New Tile">
                <div class="tile-controls">
                    <button class="btn btn-sm btn-light tile-toggle-controls" title="Toggle Controls"><i class="fas fa-chevron-up"></i></button>
                    <button class="btn btn-sm btn-light tile-split-h" title="Split side by side" aria-label="Split side by side"><svg class="split-icon" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><rect x="1.5" y="1.5" width="13" height="13" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.5"/><line x1="8" y1="2" x2="8" y2="14" stroke="currentColor" stroke-width="1.5"/></svg></button>
                    <button class="btn btn-sm btn-light tile-split-v" title="Split top and bottom" aria-label="Split top and bottom"><svg class="split-icon" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><rect x="1.5" y="1.5" width="13" height="13" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.5"/><line x1="2" y1="8" x2="14" y2="8" stroke="currentColor" stroke-width="1.5"/></svg></button>
                    <button class="btn btn-sm btn-light tile-close tile-closable" title="Close"><i class="fas fa-times"></i></button>
                </div>
            </div>
            <div class="tile-content"></div>
        </div>
    </template>

    <!-- Change dataset: the store a view opens on (main.js _showChangeDataset) -->
    <div class="modal fade" id="change-dataset-modal" tabindex="-1" aria-hidden="true" aria-labelledby="change-dataset-title">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="change-dataset-title">Change dataset</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p id="change-dataset-saved" class="small text-muted"></p>
                    <div id="change-dataset-list" class="change-dataset-list"></div>
                    <label for="change-dataset-path" class="form-label mt-3 small">Or open a path on this server</label>
                    <div class="input-group input-group-sm">
                        <input id="change-dataset-path" type="text" class="form-control" placeholder="name in the data directory, or a full path">
                        <button id="change-dataset-open-path" class="btn btn-outline-primary" type="button">Open</button>
                    </div>
                    <div id="change-dataset-error" class="small text-danger mt-1" hidden></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Panel Set Management Modal -->
    <div class="modal fade" id="session-modal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="session-modal-title">Manage Panel Sets</h5>
                    <button type="button" id="session-help-btn" class="btn btn-link session-help-btn" hidden
                        aria-label="What the Load buttons do"><i class="far fa-circle-question"></i></button>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div id="session-list-container">
                        <div class="session-search-container mb-3">
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-search"></i></span>
                                <input type="text" id="session-search" class="form-control" placeholder="Search panel sets...">
                                <button id="session-search-clear" class="btn btn-outline-secondary" type="button" style="display: none;">
                                    <i class="fas fa-times"></i>
                                </button>
                            </div>
                        </div>
                        <div class="session-grid" id="session-grid">
                            <!-- Sessions will be loaded here as cards -->
                        </div>
                    </div>
                    <div id="save-session-container" style="display: none;">
                        <div class="mb-3">
                            <label for="session-name" class="form-label">Panel Set Name</label>
                            <input type="text" class="form-control" id="session-name" placeholder="Enter a name for your session">
                            <div id="existing-sessions" class="mt-2">
                                <h6 class="text-muted small">Existing sessions:</h6>
                                <div id="session-suggestions" class="session-suggestions">
                                    <!-- Existing sessions will be displayed here -->
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div id="file-upload-section" style="display: none;">
                    <div class="upload-container">
                        <div class="file-drop-area">
                            <span class="file-message">Drag & drop a session file here or</span>
                            <label for="session-file-upload" class="browse-btn">Browse files</label>
                            <input type="file" id="session-file-upload" class="file-input" accept=".json">
                            <span id="file-name-display" class="file-name"></span>
                        </div>
                        <!-- the chosen file, with the same Load buttons as a saved set (main.js _showUploadCard) -->
                        <div id="upload-card" class="upload-card" hidden></div>
                    </div>
                </div>
                <div class="modal-footer" id="session-modal-footer">
                    <div class="modal-footer-left" style="margin-right: auto;">
                        <button type="button" id="toggle-upload-btn" class="btn btn-outline-secondary" style="display: none;">
                            <i class="fas fa-file-upload me-1"></i> Upload file
                        </button>
                    </div>
                    <button type="button" id="session-cancel-btn" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" id="btn-confirm-session" class="btn btn-primary">Load</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Local resources for offline use in Electron -->
    <!-- jQuery -->
    <script src="{{ url_for('static', filename='vendor/js/jquery-3.6.4.min.js') }}"></script>
    
    <!-- Bootstrap (must be loaded before modules that depend on it) -->
    <script src="{{ url_for('static', filename='vendor/js/bootstrap.bundle.min.js') }}"></script>
    
    <!-- Plotly -->
    <script src="{{ url_for('static', filename='vendor/js/plotly-2.20.0.min.js') }}"></script>
    
    <!-- DataTables Core and Extensions with Bootstrap 5 Integration -->
    <script src="{{ url_for('static', filename='vendor/js/jquery.dataTables.min.js') }}"></script>
    <script src="{{ url_for('static', filename='vendor/js/dataTables.bootstrap5.min.js') }}"></script>
    <script src="{{ url_for('static', filename='vendor/js/dataTables.buttons.min.js') }}"></script>
    <script src="{{ url_for('static', filename='vendor/js/buttons.bootstrap5.min.js') }}"></script>
    <script src="{{ url_for('static', filename='vendor/js/buttons.html5.min.js') }}"></script>
    <script src="{{ url_for('static', filename='vendor/js/dataTables.searchBuilder.min.js') }}"></script>
    <script src="{{ url_for('static', filename='vendor/js/searchBuilder.bootstrap5.min.js') }}"></script>
    <script src="{{ url_for('static', filename='vendor/js/dataTables.select.min.js') }}"></script>
    <script src="{{ url_for('static', filename='vendor/js/dataTables.fixedHeader.min.js') }}"></script>
    
    <!-- DataTables initialization verification -->
    <script>
        // Verify that DataTables is available
        $(document).ready(function() {
            if (typeof $.fn.DataTable === 'undefined') {
                console.error("ERROR: DataTables not available! Check installation.");
            } else {
                console.log("DataTables successfully loaded and available");
            }
            
            // Check if DataTables extensions are loaded
            // Extensions register on $.fn.dataTable (lower-case d) under their class
            // names; the capitalised DataTable object has neither, so the old
            // check logged a false error on every load.
            const extensions = ['Buttons', 'SearchBuilder'];
            let allExtensionsLoaded = true;
            
            for (const ext of extensions) {
                if (!$.fn.dataTable[ext]) {
                    console.error(`ERROR: DataTables ${ext} extension not available!`);
                    allExtensionsLoaded = false;
                }
            }
            
            if (allExtensionsLoaded) {
                console.log("All DataTables extensions successfully loaded");
            }
        });
    </script>
    
    <!-- Other libraries -->
    <script src="{{ url_for('static', filename='vendor/js/select2.min.js') }}"></script>
    <script src="{{ url_for('static', filename='vendor/js/chroma.min.js') }}"></script>
    
    <!-- Make bootstrap globally available for script modules -->
    <script>
        // Ensure bootstrap is globally available for module scripts
        window.bootstrap = bootstrap;
    </script>
    
    <!-- Application JavaScript -->
    <script type="module" src="{{ url_for('static', filename='js/config.js') }}"></script>
    <script type="module" src="{{ url_for('static', filename='js/data-manager.js') }}"></script>
    <script type="module" src="{{ url_for('static', filename='js/panel-manager.js') }}"></script>
    <script type="module" src="{{ url_for('static', filename='js/session-manager.js') }}"></script>
    <script type="module" src="{{ url_for('static', filename='js/panels/cell-plot.js') }}"></script>
    <script type="module" src="{{ url_for('static', filename='js/panels/gene-plot.js') }}"></script>
    <script type="module" src="{{ url_for('static', filename='js/panels/cell-table.js') }}"></script>
    <script type="module" src="{{ url_for('static', filename='js/panels/gene-table.js') }}"></script>
    <script type="module" src="{{ url_for('static', filename='js/panels/gene-set.js') }}"></script>
    <script type="module" src="{{ url_for('static', filename='js/main.js') }}"></script>
    
    <!-- Check dependencies are properly loaded -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Verify critical libraries are loaded
            const requiredLibs = [
                { name: 'jQuery', test: function() { return typeof $ !== 'undefined'; } },
                { name: 'Bootstrap', test: function() { return typeof bootstrap !== 'undefined'; } },
                { name: 'Plotly', test: function() { return typeof Plotly !== 'undefined'; } },
                { name: 'DataTables', test: function() { return typeof $.fn.DataTable !== 'undefined'; } },
                { name: 'DataTables.Buttons', test: function() { return typeof $.fn.dataTable.Buttons !== 'undefined'; } },
                { name: 'DataTables.SearchBuilder', test: function() { return typeof $.fn.dataTable.SearchBuilder !== 'undefined'; } },
                { name: 'DataTables.Select', test: function() { return typeof $.fn.dataTable.select !== 'undefined'; } },
                { name: 'DataTables.FixedHeader', test: function() { return typeof $.fn.dataTable.FixedHeader !== 'undefined'; } }
            ];
            
            let allLoaded = true;
            requiredLibs.forEach(function(lib) {
                if (!lib.test()) {
                    console.error(`ERROR: ${lib.name} not loaded properly!`);
                    allLoaded = false;
                }
            });
            
            if (allLoaded) {
                console.log('All dependencies loaded successfully');
            } else {
                console.error('Some dependencies failed to load - application may not function correctly');
            }
        });
    </script>
    
</body>
</html>
