{#- The small footer line of the site's legal links (annzarro/server/site.py SiteView.footer); not rendered when nothing is configured. -#}
{% if site.footer %}<footer id="site-footer" class="site-footer" aria-label="Site information"><nav aria-label="Legal and contact">{% for item in site.footer %}{% if not loop.first %}<span class="site-footer-sep" aria-hidden="true">&middot;</span><wbr>{% endif %}<a href="{{ item.href }}"{% if item.external %} target="_blank" rel="noopener noreferrer"{% endif %}{% if item.inline and about_dialog %} data-about-section="{{ item.kind }}"{% elif item.kind == 'about' and about_dialog %} data-about-open{% endif %}>{{ item.label }}</a>{% endfor %}</nav></footer>{% endif %}
