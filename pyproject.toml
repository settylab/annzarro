[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "annzarro"
version = "0.1.0"
description = "Python-based Single-Cell Data Visualization Tool"
readme = "README.md"
requires-python = ">=3.7"
license = {text = "MIT"}
authors = [
    {name = "Annzarro Contributors"}
]
keywords = ["single-cell", "visualization", "genomics", "anndata", "zarr"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
]
dependencies = [
    "flask>=2.0.0",
    "flask-cors>=3.0.0",
    "zarr>=2.13.0",
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "matplotlib>=3.4.0",
    "werkzeug>=2.0.0",
    "pyjwt>=2.0.0",
    "cryptography>=35.0.0",
    "numba>=0.53.0",
    "psutil>=5.9.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pylint>=2.17.0",
    "requests>=2.28.0",
]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "requests>=2.28.0",
]

[project.urls]
"Documentation" = "https://github.com/yourusername/annzarro#readme"
"Source" = "https://github.com/yourusername/annzarro"
"Issues" = "https://github.com/yourusername/annzarro/issues"

[project.scripts]
annzarro = "annzarro.cli:main"
annzarro-server = "annzarro.server.__main__:main"
annzarro-tests = "run_tests:main"

[tool.setuptools]
package-dir = {"" = "."}
include-package-data = true

[tool.pytest]
testpaths = ["annzarro/tests"]
python_files = "test_*.py"
python_functions = "test_*"
python_classes = "Test*"
filterwarnings = [
    "ignore::DeprecationWarning:pkg_resources.*",
    "ignore::DeprecationWarning:werkzeug.*",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
    "slow: Slow running tests",
    "real_data: Tests that require real data",
]

[tool.pylint]
disable = ["C0111", "C0301", "C0103"]
max-line-length = 100
good-names = ["i", "j", "k", "e", "f", "id", "_", "X"]

[tool.black]
line-length = 100
target-version = ["py38"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100