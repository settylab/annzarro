[build-system]
requires = ["setuptools>=77", "wheel"]  # 77: PEP 639 license / license-files
build-backend = "setuptools.build_meta"

[project]
name = "annzarro"
version = "0.1.1"
description = "Python-based Single-Cell Data Visualization Tool"
readme = "README.md"
requires-python = ">=3.9"  # list[str] annotations are evaluated at import
license = "MIT"
license-files = ["LICENSE", "annzarro/THIRD_PARTY_LICENSES/*"]
authors = [
    {name = "Annzarro Contributors"}
]
keywords = ["single-cell", "visualization", "genomics", "anndata", "zarr"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "flask>=2.0.0",
    "flask-cors>=3.0.0",
    "zarr>=2.13.0",
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "matplotlib>=3.4.0",
    "werkzeug>=2.0.0",
    "cryptography>=35.0.0",
    "numba>=0.53.0",
    "psutil>=5.9.0",
    "pyyaml>=6.0.0",
    "h5py>=3.0.0",
    "scipy>=1.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pylint>=2.17.0",
    "requests>=2.28.0",
]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "requests>=2.28.0",
]
desktop = [
    "pyinstaller>=5.0.0",
    "Pillow>=9.0.0",
]
# Remote datasets: s3:// (s3fs), gs:// (gcsfs), http(s):// (aiohttp), all via fsspec.
# Opening one without these fails with an error naming this extra.
remote = [
    "fsspec>=2023.1.0",
    "s3fs>=2023.1.0",
    "gcsfs>=2023.1.0",
    "aiohttp>=3.8.0",
]

[project.urls]
"Homepage" = "https://github.com/settylab/annzarro"
"Documentation" = "https://annzarro.readthedocs.io"
"Source" = "https://github.com/settylab/annzarro"
"Issues" = "https://github.com/settylab/annzarro/issues"

[project.scripts]
annzarro = "annzarro.cli:main"

# Packages, package data and the frontend mapping are declared in setup.py.
[tool.setuptools]
include-package-data = false
# The vendored frontend bundles (annzarro/static/vendor) are third-party code
# under their own licenses; [project] license-files ships their texts.

[tool.pytest.ini_options]
testpaths = ["annzarro/tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
python_classes = ["Test*"]
filterwarnings = [
    "ignore::DeprecationWarning:pkg_resources.*",
    "ignore::DeprecationWarning:werkzeug.*",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
    "slow: Slow running tests",
    "real_data: Tests that require real data",
]

[tool.pylint]
disable = ["C0111", "C0301", "C0103"]
max-line-length = 100
good-names = ["i", "j", "k", "e", "f", "id", "_", "X"]

[tool.black]
line-length = 100
target-version = ["py39"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100