name: Tests

# Every Python test, every JS suite (annzarro/tests/js/*.test.mjs, found by
# glob through test_js_suites.py) and ESLint, on every PR and push to main.
#
# Kept lean for Actions minutes: the full suite runs on the oldest and newest
# supported Python only. They are the two that differ in kind: 3.9 installs
# zarr 2 (zarr 3 needs Python >= 3.11), 3.13 installs zarr 3. The versions in
# between get an install-and-import check.
#
# In parallel, for wall time: on 3.13 the browser tests (annzarro/tests/browser)
# run in four jobs, each a balanced share of the files (--shard, see
# annzarro/tests/shards.py), and everything else runs in one job with
# pytest-xdist (-n auto). 3.9 has no browser and runs the whole tree with -n auto.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.name }}
    # Ubuntu 24.04, not ubuntu-latest: ubuntu-latest became 26.04 on 2026-10-19, which has no
    # Python 3.9 build, and Playwright's WebKit there misses libicudata.so.74
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: pytest + JS + ESLint (Python 3.9)
            python: "3.9"
            extras: test,remote   # zarr 2: the remote store tests run here too
            lint: true
            pytest: -n auto annzarro/tests
          - name: pytest + JS + ESLint (Python 3.13)
            python: "3.13"
            extras: test,remote
            lint: true
            # Playwright + Chromium: the browser tests outside annzarro/tests/browser
            # (e2e, export, multi-worker) run here and fail instead of skipping
            # (ANNZARRO_REQUIRE_BROWSER)
            browser: true
            pytest: -n auto annzarro/tests --ignore=annzarro/tests/browser
          # annzarro/tests/browser, one shard per job; the shard count is SHARDS
          # in annzarro/tests/utils/test_browser_shards.py, which checks that
          # the shards together collect every browser test exactly once
          - {name: browser tests 1/4 (Python 3.13), python: "3.13", extras: "test,remote", browser: true,
             pytest: annzarro/tests/browser --shard 1/4}
          - {name: browser tests 2/4 (Python 3.13), python: "3.13", extras: "test,remote", browser: true,
             pytest: annzarro/tests/browser --shard 2/4}
          - {name: browser tests 3/4 (Python 3.13), python: "3.13", extras: "test,remote", browser: true,
             pytest: annzarro/tests/browser --shard 3/4}
          - {name: browser tests 4/4 (Python 3.13), python: "3.13", extras: "test,remote", browser: true,
             pytest: annzarro/tests/browser --shard 4/4}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        if: matrix.lint
        with:
          node-version: "22"
          cache: npm

      - name: Install ESLint (pinned in package-lock.json)
        if: matrix.lint
        run: npm ci

      - name: ESLint (errors only; warnings would become PR annotations)
        if: matrix.lint
        run: npm run lint -- --quiet

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[${{ matrix.extras }}]"

      - name: Provision vendor assets
        # Mirrors run-supervised.sh: the deep-link and vendor smoke tests check
        # that the page's vendor bundles are actually served.
        run: |
          python - <<'PY'
          import importlib.util, types
          spec = importlib.util.spec_from_file_location("annzarro_install", "annzarro-install.py")
          mod = importlib.util.module_from_spec(spec); spec.loader.exec_module(mod)
          mod.download_external_resources(".", types.SimpleNamespace(no_electron_resources=False))
          PY

      - name: Install Playwright
        if: matrix.browser
        id: playwright
        run: |
          # gunicorn: test_admin_vs_user.py serves the app as deployed
          pip install playwright gunicorn
          echo "version=$(python -c 'from importlib.metadata import version; print(version("playwright"))')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright's Chromium and WebKit
        if: matrix.browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-webkit

      # WebKit is Safari's engine: memory-guard, dataset-browser and site tests run in both
      - name: Install Chromium, WebKit and their system libraries
        if: matrix.browser
        run: python -m playwright install --with-deps chromium webkit

      - name: pytest
        env:
          ANNZARRO_REQUIRE_BROWSER: ${{ matrix.browser && '1' || '' }}
          ANNZARRO_REQUIRE_LINT: ${{ matrix.lint && '1' || '' }}
        run: python -m pytest -q -rsx ${{ matrix.pytest }}

  import:
    name: install + import (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install .
      - name: Import and build the app
        working-directory: /tmp  # import the installed package, not the checkout
        run: python -c "import annzarro; from annzarro.server.core import create_app; create_app()"
