name: Annzarro Tests
# Temporarily disabled
on:
  push:
    branches:
      - disabled_branch  # Effectively disables this workflow

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-cov
      
      - name: Install Node.js dependencies
        run: npm install
      
      - name: Create data directory structure
        run: |
          mkdir -p data/sample.zarr
          echo '{"zarr_format": 2}' > data/sample.zarr/.zgroup
          
      - name: Run Python unit tests
        run: |
          python -m pytest annzarro/tests/
      
      - name: Run JavaScript tests
        run: |
          npm test
      
      - name: Run unified server tests
        run: |
          python run_tests.py --unit --integration
      
      - name: Run end-to-end tests
        run: |
          python run_tests.py --e2e