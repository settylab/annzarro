name: Desktop apps

# Builds the AnnZarro desktop app for Windows, macOS (Apple silicon and Intel)
# and Linux, each on its own platform: the bundled server is frozen with
# PyInstaller, which only targets the system it runs on.
#
# - workflow_dispatch: build and smoke-test; the files are kept as workflow
#   artifacts. Nothing is released.
# - push of a tag v*: the same, then a DRAFT GitHub release with every file
#   and SHA256SUMS.txt. A maintainer reviews and publishes it.
#
# Code signing:
#   macOS:   on a v* tag the macOS jobs run in the GitHub Environment `release`
#            (tag-only, required reviewer) and must sign with the Developer ID
#            Application identity and notarize, or the build fails. Its secrets:
#              MAC_CSC_LINK, MAC_CSC_KEY_PASSWORD  the Developer ID .p12 (base64) and its password
#              APPLE_API_KEY_P8                    the App Store Connect API key (.p8 text)
#              APPLE_API_KEY_ID, APPLE_API_ISSUER  its key id and issuer id
#            Without a tag (workflow_dispatch) the macOS app is ad-hoc signed and not notarized.
#            Setup and checks: annzarro/desktop/README.md, "Code signing".
#   Windows: WIN_CSC_LINK, WIN_CSC_KEY_PASSWORD (Authenticode .pfx, base64); read only if present.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # The signing secrets live in this environment, so only a macOS job on a tag can read them.
    environment: ${{ (startsWith(github.ref, 'refs/tags/v') && startsWith(matrix.os, 'macos')) && 'release' || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-14
            target: --mac
            arch: --arm64
          - name: macos-x64
            os: macos-15-intel
            target: --mac
            arch: --x64
          - name: windows-x64
            os: windows-latest
            target: --win
            arch: --x64
          - name: linux-x64
            # The oldest supported Ubuntu: the frozen server needs a glibc at
            # least as new as the one it was built against.
            os: ubuntu-22.04
            target: --linux
            arch: --x64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: annzarro/desktop/electron/package-lock.json

      - name: Check the app version follows the Python package
        run: |
          py=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          js=$(node -p "require('./annzarro/desktop/electron/package.json').version")
          echo "pyproject.toml: $py, package.json: $js"
          test "$py" = "$js" || { echo "::error::package.json version $js != pyproject.toml $py (run bump_version.py)"; exit 1; }
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            test "${GITHUB_REF#refs/tags/v}" = "$py" || { echo "::error::tag $GITHUB_REF != version $py"; exit 1; }
          fi
          echo "VERSION=$py" >> "$GITHUB_ENV"

      - name: Freeze the server
        run: python annzarro/desktop/scripts/build_server.py

      - name: Smoke-test the frozen server
        run: |
          exe=annzarro/desktop/electron/server/annzarro-server/annzarro-server
          [[ "$RUNNER_OS" == Windows ]] && exe="$exe.exe"
          du -sh annzarro/desktop/electron/server/annzarro-server
          python annzarro/desktop/scripts/smoke_server.py "$exe" --dataset annzarro/tests/data/fixture_small.zarr
          python annzarro/desktop/scripts/smoke_server.py "$exe" --dataset annzarro/tests/data/fixture_small_v3.zarr

      - name: Install Electron toolchain
        working-directory: annzarro/desktop/electron
        run: npm ci

      - name: macOS signing credentials
        # Tag builds only (the `release` environment). electron-builder imports the
        # certificate from CSC_LINK into a temporary keychain; the API key is written to a
        # file that only this job can read and is removed again below.
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v')
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          for v in MAC_CSC_LINK MAC_CSC_KEY_PASSWORD APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER; do
            [[ -n "${!v}" ]] || { echo "::error::secret $v is not set in the release environment"; exit 1; }
          done
          umask 077
          key="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY_ID.p8"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$key"
          {
            echo "CSC_LINK=$MAC_CSC_LINK"
            echo "CSC_KEY_PASSWORD=$MAC_CSC_KEY_PASSWORD"
            echo "APPLE_API_KEY=$key"
            echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
          } >> "$GITHUB_ENV"

      - name: Build the app
        working-directory: annzarro/desktop/electron
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          args=(${{ matrix.target }} ${{ matrix.arch }})
          if [[ "$RUNNER_OS" == macOS ]]; then
            # electron_build.js picks the signing mode: Developer ID + notarization when the
            # tag job set the credentials above, ad-hoc otherwise.
            [[ "$GITHUB_REF" == refs/tags/v* ]] && args+=(--require-notarization)
            node ../scripts/electron_build.js "${args[@]}"
          else
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            [[ -z "$WIN_CSC_LINK" ]] && unset WIN_CSC_LINK WIN_CSC_KEY_PASSWORD
            npx electron-builder "${args[@]}" --publish never
          fi
          ls -la dist

      - name: Notarize the dmg and check the macOS signature
        # electron-builder notarized and stapled the .app; the dmg around it is a separate
        # file, notarized here. Then the checks that fail the release: the signature is intact,
        # Gatekeeper reports "Notarized Developer ID", and both tickets are stapled.
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v')
        working-directory: annzarro/desktop/electron
        run: |
          for dmg in dist/AnnZarro-*.dmg; do ../scripts/mac_notarize_dmg.sh "$dmg"; done
          ../scripts/mac_verify_signature.sh "$(ls -d dist/mac*/AnnZarro.app)" dist/AnnZarro-*.dmg

      - name: Remove the API key
        if: always() && runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v')
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8

      - name: Remove GPL/LGPL libraries from the AppImage
        # electron-builder always copies libindicator (GPL-3.0),
        # libappindicator, libgconf-2 and libnotify into the AppImage's usr/lib;
        # AnnZarro needs none of them. Repack without them (mksquashfs behind
        # the original AppImage runtime, as electron-builder packs it), then
        # make sure the repacked AppImage starts.
        if: runner.os == 'Linux'
        run: |
          command -v mksquashfs || sudo apt-get install -y -qq squashfs-tools
          for a in annzarro/desktop/electron/dist/AnnZarro-*.AppImage; do
            python annzarro/desktop/scripts/repack_appimage.py "$a"
            APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a python annzarro/desktop/scripts/smoke_app.py "$a" --no-sandbox
          done

      - name: Smoke-test the app (twice at once)
        # Two self-tests start together, each with its own profile: they race
        # for the same free port, and each must end up with its own server.
        run: |
          case "$RUNNER_OS" in
            macOS)   app=$(ls -d annzarro/desktop/electron/dist/mac*/AnnZarro.app)/Contents/MacOS/AnnZarro; run=(python annzarro/desktop/scripts/smoke_app.py "$app") ;;
            Windows) run=(python annzarro/desktop/scripts/smoke_app.py annzarro/desktop/electron/dist/win-unpacked/AnnZarro.exe) ;;
            Linux)   app=$(find annzarro/desktop/electron/dist/linux-unpacked -maxdepth 1 -type f -name 'annzarro*' -perm -u+x | head -1)
                     # Unprivileged CI user: Chromium's setuid sandbox is not installed here.
                     run=(xvfb-run -a python annzarro/desktop/scripts/smoke_app.py "$app" --no-sandbox) ;;
          esac
          "${run[@]}" > smoke-a.log 2>&1 & a=$!
          "${run[@]}" > smoke-b.log 2>&1 & b=$!
          status=0; wait $a || status=1; wait $b || status=1
          cat smoke-a.log smoke-b.log
          exit $status

      - name: Offline session test (network cut off)
        # Drives the packaged app with playwright-core (no browser download):
        # open a dataset, cell plot, focus a gene and a cell, cell table, PNG
        # export. Any request not to 127.0.0.1, any failed local request or
        # page error fails the step.
        run: |
          case "$RUNNER_OS" in
            macOS)   app=$(ls -d annzarro/desktop/electron/dist/mac*/AnnZarro.app)/Contents/MacOS/AnnZarro ;;
            Windows) app=annzarro/desktop/electron/dist/win-unpacked/AnnZarro.exe ;;
            Linux)   app=$(find annzarro/desktop/electron/dist/linux-unpacked -maxdepth 1 -type f -name 'annzarro*' -perm -u+x | head -1) ;;
          esac
          run=(node annzarro/desktop/electron/test/offline-session.js "$app" annzarro/tests/data/fixture_small.zarr offline-report.json)
          if [[ "$RUNNER_OS" == Linux ]]; then xvfb-run -a "${run[@]}"; else "${run[@]}"; fi

      - name: Port clash and restart tests
        # The default port held by a program that never answers, the port
        # taken while the server starts (macOS/Linux), and a restart after
        # the last dataset was deleted: each must reach a usable window, never
        # an endless spinner.
        run: |
          case "$RUNNER_OS" in
            macOS)   app=$(ls -d annzarro/desktop/electron/dist/mac*/AnnZarro.app)/Contents/MacOS/AnnZarro; x=() ; flags=() ;;
            Windows) app=annzarro/desktop/electron/dist/win-unpacked/AnnZarro.exe; x=() ; flags=() ;;
            Linux)   app=$(find annzarro/desktop/electron/dist/linux-unpacked -maxdepth 1 -type f -name 'annzarro*' -perm -u+x | head -1); x=(xvfb-run -a); flags=(--no-sandbox) ;;
          esac
          "${x[@]}" python annzarro/desktop/scripts/port_clash_test.py "$app" "${flags[@]}"
          "${x[@]}" node annzarro/desktop/electron/test/dataset-gone.js "$app" annzarro/tests/data/fixture_small.zarr

      - name: Size report
        if: always()
        run: |
          {
            echo "### ${{ matrix.name }}"
            python annzarro/desktop/scripts/size_report.py annzarro/desktop/electron
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Collect release files
        run: |
          mkdir -p out
          cp annzarro/desktop/electron/dist/AnnZarro-"$VERSION"-* out/
          # Blockmaps let the app download only the changed parts of an update; keep the
          # macOS zip's and the Windows installer's. The dmg, AppImage and deb are not
          # updated by block (the AppImage was repacked, so its blockmap no longer fits).
          find out -name '*.blockmap' ! -name 'AnnZarro-*-macos-*.zip.blockmap' ! -name 'AnnZarro-*-setup.exe.blockmap' -delete
          # The updater metadata (latest.yml, latest-mac.yml, latest-linux.yml): sha512 and
          # size are recomputed here, after the repack and the notarization changed files.
          # The two macOS jobs each write latest-mac.yml; the release job merges them.
          pip install -q pyyaml
          cp annzarro/desktop/electron/dist/latest*.yml out/
          if [[ "$RUNNER_OS" == macOS ]]; then
            mv out/latest-mac.yml "out/latest-mac-${{ matrix.name == 'macos-arm64' && 'arm64' || 'x64' }}.yml"
          fi
          python annzarro/desktop/scripts/update_metadata.py refresh out
          ls -la out

      - name: Licence check of the release files
        # Unpacks each release file as a user gets it and checks every
        # executable and shared library in it against the server's inventory
        # and Electron's file list: no GPL/AGPL component, no unknown licence,
        # LGPL only as a separate shared library, nothing linking GNU
        # Readline or ncurses, all notices present. Fails the release otherwise.
        run: |
          set -o pipefail
          root=$PWD
          check=$root/annzarro/desktop/scripts/licence_check.py
          mkdir -p "$root/licence-check"
          status=0
          run_check() {  # <label> <unpacked app>
            echo "::group::licence check: $1"
            python "$check" "$2" --json "$root/licence-check/$1.json" \
              | tee "$root/licence-check/$1.txt" || status=1
            echo "::endgroup::"
          }
          cd out
          case "$RUNNER_OS" in
            Linux)
              dpkg-deb -x AnnZarro-*.deb ../unpack-deb
              run_check deb ../unpack-deb/opt/AnnZarro
              mkdir -p ../unpack-appimage && cp AnnZarro-*.AppImage ../unpack-appimage/a.AppImage
              (cd ../unpack-appimage && chmod +x a.AppImage && ./a.AppImage --appimage-extract >/dev/null)
              run_check appimage ../unpack-appimage/squashfs-root ;;
            macOS)
              ditto -x -k AnnZarro-*.zip ../unpack-zip
              run_check macos-zip ../unpack-zip/AnnZarro.app
              hdiutil attach -nobrowse -readonly -mountpoint ../unpack-dmg AnnZarro-*.dmg >/dev/null
              run_check macos-dmg ../unpack-dmg/AnnZarro.app
              hdiutil detach ../unpack-dmg >/dev/null ;;
            Windows)
              python -m zipfile -e AnnZarro-*-windows-*.zip ../unpack-zip
              run_check windows-zip ../unpack-zip
              7z x -y -o../unpack-setup AnnZarro-*-setup.exe >/dev/null
              7z x -y -o../unpack-setup/app ../unpack-setup/\$PLUGINSDIR/app-64.7z >/dev/null
              run_check windows-setup ../unpack-setup/app ;;
          esac
          cd ..
          exit $status

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: licence-check-${{ matrix.name }}
          path: licence-check/*
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: AnnZarro-${{ env.VERSION }}-${{ matrix.name }}
          path: out/*
          if-no-files-found: error
          compression-level: 0

  release:
    name: Draft release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: assets
          pattern: AnnZarro-*
          merge-multiple: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Updater metadata
        # The app updates itself from latest-mac.yml, latest.yml and latest-linux.yml of the
        # published release. The macOS ones come per architecture and become one file listing
        # both; then every file the three name must be among the assets with the stated
        # sha512 (the versionless copies below are not named in them).
        run: |
          pip install -q pyyaml
          python annzarro/desktop/scripts/update_metadata.py merge-mac assets
          python annzarro/desktop/scripts/update_metadata.py verify assets
          for f in latest.yml latest-mac.yml latest-linux.yml; do test -f "assets/$f" || { echo "::error::$f is missing"; exit 1; }; done

      - name: Checksums
        working-directory: assets
        run: |
          # versionless copies, so /releases/latest/download/<name> stays valid across releases
          for f in macos-arm64.dmg macos-x64.dmg windows-x64-setup.exe linux-x86_64.AppImage linux-amd64.deb; do
            cp AnnZarro-*-"$f" "AnnZarro-$f"
          done
          sha256sum AnnZarro-* latest*.yml > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the release notes are the version's CHANGELOG.md section; the build stops if it has none
          version="${GITHUB_REF_NAME#v}"
          {
            echo "## AnnZarro $version"
            echo
            python3 scripts/changelog.py notes "$version"
            echo
            echo "### Install"
            echo
            echo "\`pip install annzarro==$version\` (PyPI), or a desktop app below. macOS: open the dmg, drag AnnZarro to Applications and open it. Windows: the build is not signed, so SmartScreen asks for More info > Run anyway. Details: https://annzarro.readthedocs.io/en/latest/getting-started/desktop-app.html (First launch). Verify downloads against SHA256SUMS.txt."
          } > notes.md
          gh release create "$GITHUB_REF_NAME" assets/* \
            --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "AnnZarro $version" \
            --notes-file notes.md
