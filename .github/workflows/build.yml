name: Build Desktop Apps

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: mac
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '16'
          
      - name: Install Python dependencies
        run: |
          pip install -e .
          
      - name: Make CLI executable (Unix)
        if: runner.os != 'Windows'
        run: chmod +x ./annzarro-cli
          
      - name: Install dependencies via CLI
        run: |
          ./annzarro-cli install
          
      - name: Build desktop app using CLI
        env:
          # Set environment variables to disable publishing
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
          ELECTRON_BUILDER_PUBLISH: never
        run: |
          ./annzarro-cli desktop build --platform ${{ matrix.platform }}
          
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: annzarro-${{ matrix.platform }}
          path: annzarro/desktop/electron/dist/*
          
  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: annzarro-*/*