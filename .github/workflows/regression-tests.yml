name: Deep-link regression tests

# High-signal guard for the two operator-discovered deep-link failures:
#   * BUG #1 -- unprovisioned static/vendor/ -> bundle 404s -> "Initialization failed"
#   * BUG #2 -- Math.min(...largeColumn) stack overflow before the plot renders
# Scoped to the new regression tests so it stays fast and green; the broader
# (currently disabled) suites can be folded in separately.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  deeplink-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install package + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Provision vendor assets
        # Mirrors run-supervised.sh: drive annzarro-install.py's download step so
        # the vendor smoke test (BUG #1) is meaningful in CI.
        run: |
          python - <<'PY'
          import importlib.util, types
          spec = importlib.util.spec_from_file_location("annzarro_install", "annzarro-install.py")
          mod = importlib.util.module_from_spec(spec); spec.loader.exec_module(mod)
          mod.download_external_resources(".", types.SimpleNamespace(no_electron_resources=False))
          PY

      - name: Run deep-link regression tests
        run: |
          python -m pytest -v \
            annzarro/tests/e2e/test_deeplink_smoke.py \
            annzarro/tests/utils/test_vendor_provisioning.py \
            annzarro/tests/static/test_no_unsafe_array_spread.py \
            annzarro/tests/js/test_js_array_stats.py
