<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnnZarro - Zarr-based AnnData Visualization</title>
    
    <!-- External Dependencies -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/jquery.dataTables.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/searchbuilder/1.4.2/css/searchBuilder.dataTables.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom Styles -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Top Bar with Global Controls -->
    <header id="app-header" class="app-header">
        <div class="container-fluid">
            <div class="row align-items-center">
                <div class="col-md-2">
                    <h1 class="app-title">AnnZarro</h1>
                </div>
                <div class="col-md-10">
                    <div class="global-controls">
                        <div class="row align-items-center">
                            <div class="col">
                                <label for="dataset-selector">Dataset:</label>
                                <select id="dataset-selector" class="form-select"></select>
                            </div>
                            <div class="col">
                                <label for="focused-gene">Focused Gene:</label>
                                <select id="focused-gene" class="form-select"></select>
                            </div>
                            <div class="col">
                                <label for="focused-cell">Focused Cell:</label>
                                <select id="focused-cell" class="form-select"></select>
                            </div>
                            <div class="col">
                                <label for="taxonomy-id">Taxonomy ID:</label>
                                <select id="taxonomy-id" class="form-select">
                                    <option value="9606" selected>9606 (Homo sapiens)</option>
                                    <option value="10090">10090 (Mus musculus)</option>
                                </select>
                            </div>
                            <div class="col">
                                <div class="btn-group">
                                    <button id="btn-save-session" class="btn btn-primary"><i class="fas fa-save"></i> Save</button>
                                    <button id="btn-load-session" class="btn btn-secondary"><i class="fas fa-folder-open"></i> Load</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </header>
    
    <!-- Dataset Stats Bar -->
    <div id="dataset-stats" class="dataset-stats">
        <div class="container-fluid">
            <div class="row">
                <div class="col-md-3">
                    <span>Cells: <span id="cell-count">-</span></span>
                </div>
                <div class="col-md-3">
                    <span>Genes: <span id="gene-count">-</span></span>
                </div>
                <div class="col-md-6">
                    <span>Dataset: <span id="dataset-path">-</span></span>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Main Content Area - Tile Container -->
    <main id="tile-container" class="tile-container">
        <!-- Tiles will be dynamically added here -->
    </main>
    
    <!-- Controls Footer -->
    <footer class="app-footer">
        <div class="container-fluid">
            <div class="row">
                <div class="col">
                    <button id="btn-add-tile" class="btn btn-success"><i class="fas fa-plus"></i> Add Tile</button>
                </div>
            </div>
        </div>
    </footer>
    
    <!-- Templates -->
    <template id="tile-template">
        <div class="tile" data-tile-id="">
            <div class="tile-header">
                <input type="text" class="tile-title" value="New Tile">
                <div class="tile-controls">
                    <button class="btn btn-sm btn-light tile-split-h" title="Split Horizontally"><i class="fas fa-columns"></i></button>
                    <button class="btn btn-sm btn-light tile-split-v" title="Split Vertically"><i class="fas fa-columns fa-rotate-90"></i></button>
                    <button class="btn btn-sm btn-light tile-close" title="Close"><i class="fas fa-times"></i></button>
                </div>
            </div>
            <div class="tile-content"></div>
        </div>
    </template>
    
    <!-- Add Tile Modal -->
    <div class="modal fade" id="add-tile-modal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Add Tile</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="tile-type" class="form-label">Tile Type</label>
                        <select id="tile-type" class="form-select">
                            <option value="cell-plot">Cell Plot</option>
                            <option value="gene-plot">Gene Plot</option>
                            <option value="cell-table">Cell Table</option>
                            <option value="gene-table">Gene Table</option>
                            <option value="gene-set">Gene Set Analysis</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="tile-source" class="form-label">Source Tile (Optional)</label>
                        <select id="tile-source" class="form-select">
                            <option value="">Create New</option>
                            <!-- Available tiles will be populated here -->
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" id="btn-create-tile" class="btn btn-primary">Create</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Session Management Modal -->
    <div class="modal fade" id="session-modal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="session-modal-title">Manage Sessions</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div id="session-list-container">
                        <table id="session-table" class="table">
                            <thead>
                                <tr>
                                    <th>Name</th>
                                    <th>Dataset</th>
                                    <th>Date</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="session-list">
                                <!-- Sessions will be loaded here -->
                            </tbody>
                        </table>
                    </div>
                    <div id="save-session-container" style="display: none;">
                        <div class="mb-3">
                            <label for="session-name" class="form-label">Session Name</label>
                            <input type="text" class="form-control" id="session-name">
                        </div>
                    </div>
                </div>
                <div class="modal-footer" id="session-modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" id="btn-confirm-session" class="btn btn-primary">Load</button>
                </div>
            </div>
        </div>
    </div>

    <!-- External Dependencies -->
    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.plot.ly/plotly-2.20.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/searchbuilder/1.4.2/js/dataTables.searchBuilder.min.js"></script>
    
    <!-- Application JavaScript -->
    <script src="js/config.js"></script>
    <script src="js/data-manager.js"></script>
    <script src="js/panel-manager.js"></script>
    <script src="js/session-manager.js"></script>
    <script src="js/panels/cell-plot.js"></script>
    <script src="js/panels/gene-plot.js"></script>
    <script src="js/panels/cell-table.js"></script>
    <script src="js/panels/gene-table.js"></script>
    <script src="js/panels/gene-set.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
