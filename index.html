<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnnZarro - Zarr-based AnnData Visualization</title>
    
    <!-- External Dependencies -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/jquery.dataTables.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/searchbuilder/1.4.2/css/searchBuilder.dataTables.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/select/1.6.2/css/select.dataTables.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/buttons/2.3.6/css/buttons.dataTables.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css">
    
    <!-- Custom Styles -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Top Bar with Global Controls -->
    <header id="app-header" class="app-header">
        <div class="container-fluid">
            <div class="row align-items-center">
                <div class="col-md-2">
                    <h1 class="app-title">AnnZarro</h1>
                </div>
                <div class="col-md-10">
                    <div class="global-controls">
                        <div class="row align-items-center">
                            <div class="col">
                                <label for="dataset-selector">Dataset:</label>
                                <div class="d-flex">
                                    <select id="dataset-selector" class="form-select" data-allow-custom="true"></select>
                                    <button id="refresh-dataset" class="btn btn-outline-secondary ms-1" title="Refresh dataset">
                                        <i class="fas fa-sync-alt"></i>
                                    </button>
                                </div>
                            </div>
                            <div class="col">
                                <label for="focused-gene">Focused Gene:</label>
                                <div class="d-flex">
                                    <div class="btn-group btn-group-sm me-1">
                                        <button id="gene-history-back" class="btn btn-outline-secondary" title="Previous gene" disabled>
                                            <i class="fas fa-chevron-left"></i>
                                        </button>
                                        <button id="gene-history-forward" class="btn btn-outline-secondary" title="Next gene" disabled>
                                            <i class="fas fa-chevron-right"></i>
                                        </button>
                                    </div>
                                    <select id="focused-gene" class="form-select flex-grow-1"></select>
                                </div>
                            </div>
                            <div class="col">
                                <label for="focused-cell">Focused Cell:</label>
                                <div class="d-flex">
                                    <div class="btn-group btn-group-sm me-1">
                                        <button id="cell-history-back" class="btn btn-outline-secondary" title="Previous cell" disabled>
                                            <i class="fas fa-chevron-left"></i>
                                        </button>
                                        <button id="cell-history-forward" class="btn btn-outline-secondary" title="Next cell" disabled>
                                            <i class="fas fa-chevron-right"></i>
                                        </button>
                                    </div>
                                    <select id="focused-cell" class="form-select flex-grow-1"></select>
                                </div>
                            </div>
                            <div class="col">
                                <div class="btn-group">
                                    <button id="btn-save-session" class="btn btn-primary"><i class="fas fa-save"></i> Save Panel Set</button>
                                    <button id="btn-load-session" class="btn btn-secondary"><i class="fas fa-folder-open"></i> Load Panel Set</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </header>
    
    <!-- Dataset Stats Bar -->
    <div id="dataset-stats" class="dataset-stats">
        <div class="container-fluid">
            <div class="row">
                <div class="col-md-3">
                    <span>Cells: <span id="cell-count">-</span></span>
                </div>
                <div class="col-md-3">
                    <span>Genes: <span id="gene-count">-</span></span>
                </div>
                <div class="col-md-6">
                    <span>Dataset: <span id="dataset-path">-</span></span>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Main Content Area - Tile Container -->
    <main id="tile-container" class="tile-container">
        <!-- Tiles will be dynamically added here -->
    </main>
    
    <!-- We're removing the footer as we'll add tile creation in the layout manager -->
    
    <!-- Templates -->
    <template id="tile-template">
        <div class="tile" data-tile-id="">
            <div class="tile-header">
                <input type="text" class="tile-title" value="New Tile">
                <div class="tile-controls">
                    <button class="btn btn-sm btn-light tile-toggle-controls" title="Toggle Controls"><i class="fas fa-chevron-up"></i></button>
                    <button class="btn btn-sm btn-light tile-split-h" title="Split Horizontally"><i class="fas fa-columns"></i></button>
                    <button class="btn btn-sm btn-light tile-split-v" title="Split Vertically"><i class="fas fa-columns fa-rotate-90"></i></button>
                    <button class="btn btn-sm btn-light tile-close tile-closable" title="Close"><i class="fas fa-times"></i></button>
                </div>
            </div>
            <div class="tile-content"></div>
        </div>
    </template>

    <!-- Panel Set Management Modal -->
    <div class="modal fade" id="session-modal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="session-modal-title">Manage Panel Sets</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div id="session-list-container">
                        <div class="session-search-container mb-3">
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-search"></i></span>
                                <input type="text" id="session-search" class="form-control" placeholder="Search saved sessions...">
                                <button id="session-search-clear" class="btn btn-outline-secondary" type="button" style="display: none;">
                                    <i class="fas fa-times"></i>
                                </button>
                            </div>
                        </div>
                        <div class="session-grid" id="session-grid">
                            <!-- Sessions will be loaded here as cards -->
                        </div>
                    </div>
                    <div id="save-session-container" style="display: none;">
                        <div class="mb-3">
                            <label for="session-name" class="form-label">Panel Set Name</label>
                            <input type="text" class="form-control" id="session-name" placeholder="Enter a name for your session">
                            <div id="existing-sessions" class="mt-2">
                                <h6 class="text-muted small">Existing sessions:</h6>
                                <div id="session-suggestions" class="session-suggestions">
                                    <!-- Existing sessions will be displayed here -->
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div id="file-upload-section" style="display: none;">
                    <div class="upload-container">
                        <div class="file-drop-area">
                            <span class="file-message">Drag & drop a session file here or</span>
                            <label for="session-file-upload" class="browse-btn">Browse files</label>
                            <input type="file" id="session-file-upload" class="file-input" accept=".json">
                            <span id="file-name-display" class="file-name"></span>
                        </div>
                    </div>
                </div>
                <div class="modal-footer" id="session-modal-footer">
                    <div class="modal-footer-left" style="margin-right: auto;">
                        <button type="button" id="toggle-upload-btn" class="btn btn-outline-secondary" style="display: none;">
                            <i class="fas fa-file-upload me-1"></i> Upload file
                        </button>
                    </div>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" id="btn-confirm-session" class="btn btn-primary">Load</button>
                </div>
            </div>
        </div>
    </div>

    <!-- External Dependencies -->
    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.plot.ly/plotly-2.20.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/select/1.6.2/js/dataTables.select.min.js"></script>
    <script src="https://cdn.datatables.net/searchbuilder/1.4.2/js/dataTables.searchBuilder.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.3.6/js/dataTables.buttons.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.3.6/js/buttons.html5.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chroma-js@2.4.2/chroma.min.js"></script>
    
    <!-- Application JavaScript -->
    <script type="module" src="js/config.js"></script>
    <script type="module" src="js/data-manager.js"></script>
    <script type="module" src="js/panel-manager.js"></script>
    <script type="module" src="js/session-manager.js"></script>
    <script type="module" src="js/panels/cell-plot.js"></script>
    <script type="module" src="js/panels/gene-plot.js"></script>
    <script type="module" src="js/panels/cell-table.js"></script>
    <script type="module" src="js/panels/gene-table.js"></script>
    <script type="module" src="js/panels/gene-set.js"></script>
    <script type="module" src="js/main.js"></script>
    
    <!-- Override styles for DataTables -->
    <style>
        /* Compact font size for the table */
        .table-panel table.dataTable thead th,
        .table-panel table.dataTable tbody td {
            font-size: 0.85rem;
            padding: 4px 8px;
        }
        
        /* Striped rows with white and light background */
        .table-panel table.dataTable.stripe tbody tr.even {
            background-color: white !important;
        }
        
        .table-panel table.dataTable.stripe tbody tr.odd {
            background-color: #f8f9fa;
        }
        
        .table-panel table.dataTable tbody tr:hover {
            background-color: rgba(0, 123, 255, 0.05);
        }
        
        /* Keep scrolling containers synchronized - critical for header alignment */
        .table-panel .dataTables_scrollHeadInner,
        .table-panel .dataTables_scrollHeadInner table {
            width: 100% !important;
        }
        
        /* Ensure column headers align with body */
        .table-panel .dataTables_scrollHead,
        .table-panel .dataTables_scrollBody {
            width: 100% !important;
        }
        
        /* Fix column width synchronization */
        .table-panel table.dataTable thead th,
        .table-panel table.dataTable tbody td {
            width: auto !important;
        }
        
        /* Fix dropdown styling */
        .table-length .form-select {
            padding: 0.25rem 2rem 0.25rem 0.5rem;
            background-position: right 0.5rem center;
        }
        
        /* No footer border */
        .table-panel table.dataTable.no-footer {
            border-bottom: none !important;
        }
        
        /* Remove all DataTables scroll container borders */
        .table-panel .dataTables_wrapper .dataTables_scroll,
        .table-panel .dataTables_wrapper .dataTables_scrollHead,
        .table-panel .dataTables_wrapper .dataTables_scrollHeadInner,
        .table-panel .dataTables_wrapper .dataTables_scrollBody {
            border: none !important;
        }
    </style>
</body>
</html>
