# AnnZarro configuration baked into the container image (ANNZARRO_CONFIG points here).
# Mount your own file over it, or override single values with ANNZARRO_<SECTION>_<KEY>
# environment variables (ANNZARRO_SERVER_PROXY_COUNT=1, ANNZARRO_SERVER_WORKERS=4, ...).
server:
  host: 0.0.0.0              # the container's own network namespace; publish the port as you need
  port: 8000
  data_dir: /data            # the datasets, mounted read-only; AnnZarro never writes here
  state_dir: /state          # panel sets (/state/panel-sets), users, admin settings, caches
  log_file: /state/logs/annzarro_server.log
auth:
  user_file: /state/auth/users.json   # the login key and the admin state are kept beside it
