<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AnnZarro - Error</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #f5f5f5;
      color: #333;
    }
    .container {
      text-align: center;
      padding: 20px;
      max-width: 600px;
    }
    h1 {
      margin: 0 0 20px 0;
      font-size: 28px;
      font-weight: 500;
      color: #dc3545;
    }
    p {
      margin: 10px 0;
      font-size: 16px;
      color: #666;
      line-height: 1.5;
    }
    .error-icon {
      font-size: 60px;
      color: #dc3545;
      margin-bottom: 20px;
    }
    .btn {
      display: inline-block;
      margin: 20px 10px;
      padding: 10px 20px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
      text-decoration: none;
    }
    .btn:hover {
      background-color: #0069d9;
    }
    .btn.secondary {
      background-color: #6c757d;
    }
    .btn.secondary:hover {
      background-color: #5a6268;
    }
    .logo {
      margin-bottom: 20px;
      max-width: 150px;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="icons/icon.png" alt="AnnZarro Logo" class="logo">
    <div class="error-icon">⚠️</div>
    <h1>Server Error</h1>
    <p>The AnnZarro server failed to start. This could be due to:</p>
    <p>
      • Another application using the same port<br>
      • Missing dependencies<br>
      • Permission issues<br>
      • Incomplete installation
    </p>
    <p>Check the application logs for more details.</p>
    <div class="actions">
      <button class="btn" id="restartBtn">Restart Server</button>
      <button class="btn secondary" id="quitBtn">Quit Application</button>
    </div>
  </div>
  
  <script>
    // Handle restart button
    document.getElementById('restartBtn').addEventListener('click', async () => {
      try {
        await window.api.restartServer();
        // If successful, reload the page
        setTimeout(() => {
          window.location.href = '/'; // Will go to loading screen
        }, 1000);
      } catch (err) {
        alert('Failed to restart the server. Please quit and restart the application.');
      }
    });
    
    // Handle quit button
    document.getElementById('quitBtn').addEventListener('click', () => {
      window.close();
    });
  </script>
</body>
</html>
