<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AnnZarro - Loading</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #f5f5f5;
      color: #333;
    }
    .container {
      text-align: center;
      padding: 20px;
    }
    h1 {
      margin: 0 0 20px 0;
      font-size: 28px;
      font-weight: 500;
    }
    p {
      margin: 10px 0;
      font-size: 16px;
      color: #666;
    }
    .spinner {
      width: 40px;
      height: 40px;
      margin: 30px auto;
      border-radius: 50%;
      border: 4px solid rgba(0, 0, 0, 0.1);
      border-top-color: #007bff;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .logo {
      margin-bottom: 20px;
      max-width: 150px;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="icons/icon.png" alt="AnnZarro Logo" class="logo">
    <h1>AnnZarro</h1>
    <div class="spinner"></div>
    <p id="status">Starting the AnnZarro server</p>
  </div>

  <script>
    // The main process reports progress here (elapsed time, first-start note).
    window.setStatus = (text) => {
      document.getElementById('status').textContent = text;
    };
  </script>
</body>
</html>
