# AnnZarro Base Configuration
# This file contains common settings shared across all environments

# Server configuration
server:
  # Network settings
  host: 127.0.0.1
  port: 8000
  unified_server: true
  
  # API configuration
  cors_enabled: false
  cors_origins: "*"
  
  # HTTPS settings (enabled in production)
  https_enabled: false
  cert_file: null
  key_file: null
  
  # Cross-origin isolation (COOP/COEP headers): lets Chromium measure the
  # page's memory (performance.measureUserAgentSpecificMemory) so the memory
  # guard can use measured rather than estimated numbers. off | on | auto
  # (auto: on, except for pages loaded inside a frame of another site).
  cross_origin_isolation: "off"

  # Proxy settings
  proxy_count: 0
  # Path the app is served under behind a reverse proxy, e.g. "/explore"
  # (empty = the root). Works whether the proxy strips the prefix or not.
  # A trusted proxy (proxy_count > 0) can instead send X-Forwarded-Prefix.
  url_prefix: ""
  
  # Data storage
  # Datasets and shared panel sets (sessions/). A relative path is taken
  # relative to the directory annzarro is started from; the default is the
  # folder the desktop app uses.
  data_dir: "~/annzarro-data"
  # Where annzarro keeps what it writes (users, admin state, logs, caches, the
  # PID file). Never inside a data root: the server refuses to start then.
  # Also --state-dir and ANNZARRO_SERVER_STATE_DIR (ANNZARRO_HOME is the older
  # name). `annzarro paths` lists every location and why it is there.
  state_dir: "~/.annzarro"
  # Optional, default <state_dir>/cache: disposable caches, safe to delete.
  # cache_dir: /var/cache/annzarro
  # Optional, default <state_dir>/panel-sets. Reserved: panel sets still live
  # in <data_dir>/sessions until they move.
  # panel_sets_dir: /var/lib/annzarro/panel-sets
  # Directories beyond data_dir a shared server may read datasets from, e.g.
  # ["/lab/atlases"]. Every dataset path must resolve (symlinks and ".."
  # followed) inside data_dir or one of these.
  # allowed_dirs: []
  # Who may open a dataset path outside those directories:
  #   admins - admins of a shared server with login: an admin login can read
  #            any file the server process can read (each open is logged
  #            with the admin's name); other users never. On a local server
  #            (loopback, no login: the laptop, the desktop app) its one user.
  #   local-only - only that local single user; on a shared server
  #            nobody, admins included
  #   none   - nobody, local servers included (lock-down)
  arbitrary_paths: admins
  
  # Logging configuration
  # null = ~/.annzarro/logs/annzarro_server.log (under server.state_dir).
  # A relative path is taken relative to the directory annzarro is started from.
  log_file: null
  log_level: "INFO"
  # text = the usual lines. json = one JSON object per line on stderr (time, level,
  # logger, message, request id, method, route group, status, duration), for a log
  # shipper; the log file stays text. docs/deployment/monitoring.md
  log_format: text

  # Prometheus metrics at /metrics: off unless true. Only these addresses or
  # networks may read it (loopback when unset); a request that came through a
  # reverse proxy is refused unless proxy_count trusts the proxy.
  metrics_enabled: false
  # metrics_allow: [127.0.0.0/8, "::1/128"]
  
  # Response size protection
  max_response_elements: 10000000
  
  # Caching configuration
  cache_enabled: true
  cache_memory_mb: 1000
  cache_dataset_limit: 10
  # POST /data/refresh (Refresh dataset; any user) walks a dataset's files at
  # most this often; a refresh sooner answers with the last walk's finding.
  refresh_min_interval_s: 10
  # Memory the name-search indices (Focused Cell / Focused Gene typeahead)
  # may hold together, per worker process, in MB. null = 15% of the machine's
  # RAM, between 512 MB and 16 GB. A dataset whose index would not fit is
  # searched by scanning its names instead (no index in memory); the reply
  # says partial when the scan stopped before the end.
  name_index_max_mb: null
  # Names a scanning search reads at most before it answers with what it has.
  name_search_scan_names: 100000000
  # Entries one request of the dataset picker's folder listing returns; a
  # larger folder is read in pages ("show more").
  dataset_folder_max_entries: 500
  # How deep, and over how many entries, the picker's search of the data
  # directory goes before it stops and says the result is partial.
  dataset_search_max_depth: 6
  dataset_search_max_entries: 20000
  # Seconds the dataset browser's details request (GET /datasets/details) spends
  # on the store check of one zarr store before it answers with the findings so
  # far (budget_reached: true). 0 = the details never run the check.
  dataset_details_check_budget_s: 1.5
  # Search over the attribution and READMEs of the local datasets. A crawl
  # (one at a time on the server) reads the attribution fields and the first
  # text_index_readme_kb KB of each README into one shared index in the cache
  # directory, text_index_workers threads at a time, text_index_store_timeout_s
  # per store, text_index_crawl_timeout_s per crawl (then it saves what it has
  # and is marked partial) and text_index_max_stores stores at most. The index
  # holds text_index_max_mb MB at most (READMEs are dropped from the largest
  # down). A search older than text_index_ttl_s starts a refresh, and a crawl
  # starts at most every text_index_min_interval_s seconds (0 = no limit).
  # text_index_enabled: false turns the search off and stops the crawl.
  text_index_enabled: true
  text_index_workers: 2
  text_index_store_timeout_s: 5
  text_index_crawl_timeout_s: 300
  text_index_max_stores: 20000
  text_index_readme_kb: 64
  text_index_max_mb: 64
  text_index_ttl_s: 600
  text_index_min_interval_s: 60
  # Longest regular expression a name search (mode=regex) runs, in characters,
  # and the seconds one regex scan may take before it answers with the matches
  # found so far (partial: true). Patterns that repeat a repeat or branch inside
  # one, such as (a+)+, are refused first (400 regex_too_complex). Every match
  # also runs under this time limit with the `regex` package, which stops
  # inside a match. 0 = no scan limit (a single match is still cut at 10 s).
  name_search_max_regex_chars: 200
  name_search_timeout_s: 10
  # Fairness. The percentage of read_budget_mb one user (with login off: one
  # client address) may hold at once; the rest stays for everybody else. Never
  # less than one read of max_read_mb. 0 = no share. And how many cell subsets
  # (/data/subset: a pass over a column of every cell) one worker computes at
  # once may hold, in MB: each is charged 55 bytes per cell of its dataset (measured
  # at 95.6M cells: a numeric filter holds 5 GB; six at once held 30 GB). null =
  # 15% of the machine's RAM per worker. Another subset waits subset_wait_s seconds
  # for it, then 503 read_busy with Retry-After. A subset larger than the whole budget
  # runs alone (logged), never refused outright.
  read_user_share_percent: 50
  subset_budget_mb: null
  subset_wait_s: 30
  # gunicorn (annzarro/server/gunicorn_config.py; `annzarro start` is not
  # gunicorn and ignores these): a worker is replaced after max_requests
  # requests (+ up to max_requests_jitter, so they do not restart together),
  # which frees memory that crept; its caches start empty. 0 = never. The
  # limit_request_* values bound one request's line and headers (bytes).
  max_requests: 20000
  max_requests_jitter: 2000
  limit_request_line: 0
  limit_request_fields: 100
  limit_request_field_size: 8190
  # Largest request body the server reads, in MB. Panel sets (saved or
  # imported) are the only uploads; a larger one is refused with 413
  # request_too_large before it is read. 0 = no limit.
  max_request_mb: 64
  # Panel sets (the JSON files in <data_dir>/sessions): how many one user may
  # keep (with login off all sets are one user's), how many the server keeps,
  # and the MB they may take together. A save, duplicate or import past a limit
  # is refused with 409 session_quota_user / session_quota_total. 0 = no limit.
  max_sessions_per_user: 500
  max_sessions: 5000
  max_sessions_mb: 256
  # Seconds a request waits for the lock on the users file (every login writes
  # it) or the admin state before it gives up with 503 busy and Retry-After.
  lock_timeout_s: 10
  # The admin web interface (/admin, needs login). Directories an admin may
  # add as data directories in the browser must lie inside one of these;
  # empty = adding is off, listing still works. Keep these directories writable
  # by trusted accounts only (a link swapped in after the check is followed).
  # Admin changes need the admin's password entered within
  # admin_reauth_minutes (0 = never asked).
  # admin_rate_per_minute bounds changes per admin and worker (reads get 8x).
  # The audit log (annzarro_admin/audit.jsonl beside the users file) rotates
  # at admin_audit_max_mb (0 = never).
  admin_data_roots: []
  admin_reauth_minutes: 30
  admin_rate_per_minute: 30
  admin_audit_max_mb: 50
  # Directory entries the legacy dataset listing (/core/datasets) and the store
  # count in /status read before they stop; a store's own chunk files are never
  # walked. The listing then says truncated: true.
  dataset_scan_max_entries: 200000
  # Memory one read of an obsp/varp matrix may hold, in MB, estimated from the
  # store's metadata BEFORE any chunk is read (dense: rows x columns x itemsize;
  # sparse: its stored arrays plus the dense block returned). A request over it
  # is refused with 413 read_too_large, naming the element and its size. A dense
  # n x n obsp is 120 GB at 175,000 cells. null = 5% of the machine's RAM,
  # between 256 MB and 4 GB. Applies to every user, admins included.
  max_read_mb: null
  # MB a reply of every cell or gene name may hold when it is built whole,
  # estimated at 170 bytes a name (2048 = about 12 million names) before any
  # name is read; over it the request is a 413 read_too_large. A zarr store
  # streams its names a chunk at a time, a cell subset too, and has no limit;
  # this applies to h5ad files and to an index stored as a categorical.
  # 0 = no limit.
  max_names_json_mb: 2048
  # Streams of every cell or gene name one worker sends at once. Each holds a
  # server thread until its client has read the reply (a slow reader holds it
  # for as long as it keeps the connection open); one more is answered 503
  # read_busy with Retry-After before any byte is sent. 0 = no limit.
  names_stream_max_concurrent: 2
  # Only lists of more names than this count against that cap (opening a
  # dataset reads one list of each axis, and must not wait for slow readers).
  names_stream_slot_above: 1000000
  # What all the pairwise reads in flight in one worker process may hold
  # together, in MB (each charged its estimate). null = twice max_read_mb. A read
  # that does not fit waits up to read_wait_s seconds for others to finish, then
  # answers 503 read_busy with Retry-After; the web client retries once.
  read_budget_mb: null
  read_wait_s: 5

  # Remote datasets (s3://, gs://, http(s):// zarr stores; needs annzarro[remote])
  # A remote dataset path makes the server fetch a URL chosen by the client.
  #   auto  - allowed on a local single-user server (loopback host, no auth,
  #           no proxy); otherwise only URLs under remote_allowlist
  #   allow - always allowed (restricted to remote_allowlist if it is set)
  #   deny  - never
  remote_stores: auto
  remote_allowlist: []  # e.g. ["s3://my-lab-bucket/atlases/", "https://data.example.org/zarr/"]
  # anonymous   - unsigned requests (public buckets / plain HTTP)
  # environment - backend credential chain: AWS_* env vars, AWS_PROFILE/~/.aws,
  #               instance roles; Google application default credentials
  remote_credentials: anonymous
  # Seconds to establish a connection / to wait between bytes. A store that
  # stops answering fails the request with HTTP 504 instead of holding it.
  remote_connect_timeout_s: 10
  remote_read_timeout_s: 30
  # Seconds one request may spend on remote reads in total. The two timeouts
  # above bound one wait; a host that sends a byte every 29 s never trips them.
  # Past this the connection is closed and the request answers 504
  # remote_deadline. null = 120 on a hosted server, 600 on a single-user one;
  # 0 = no limit.
  remote_request_timeout_s: null
  # In-memory LRU of raw bytes per open remote store (zarr 3 only; 0 = off).
  # The reader's result cache only answers identical requests; this one makes
  # a different gene or column from already-fetched chunks local.
  remote_chunk_cache_mb: 256

# Authentication configuration
auth:
  # enabled: leave unset. Unset means off for a loopback `annzarro start`, on for a
  # non-loopback host and for the WSGI (gunicorn) entry point. Setting it to false
  # on a shared server is honoured but logs a security warning.
  # null = ~/.annzarro/auth/users.json; a source checkout keeps using an existing
  # <checkout>/config/auth/users.json.
  user_file: null
  # secret_key: leave unset; a random key is generated once and kept (mode 0600) beside user_file
  # Seconds without a request after which a login expires (0 = never).
  session_timeout: 28800
  # Secure flag on the login cookie. auto: set when the request arrived over
  # HTTPS -- directly, or per X-Forwarded-Proto from the server.proxy_count
  # trusted proxies. true forces it (the cookie is then never sent over plain
  # HTTP, so login over http:// stops working); false never sets it.
  cookie_secure: auto

# Application branding
branding:
  app_name: "AnnZarro"
  project_description: "Zarr-based AnnData Visualization Tool"

  # Who a user who sees only some datasets (access.restricted) is told to ask for more, in the
  # dataset browser's banner when a link or a panel set names a dataset they cannot read:
  # "Ask <admin_contact> for access." A name or an email address; nothing is said when it is empty.
  admin_contact: null
  
  # Contact block on the login page, shown only when something is set here.
  # Fill it in for your site, e.g.:
  #   lab_name: "Example Lab"
  #   lab_url: "https://lab.example.org"
  #   email: "annzarro-admin@example.org"
  contact_info:
    lab_name: null
    lab_url: null
    email: null
    custom_html: null

# The site this server is: who runs it and the texts a public site owes its visitors
# (docs/deployment/public-site.md). On a local or desktop AnnZarro nothing here shows until it
# is set; a server other people reach links About and Data & privacy (/site/data) from its
# footer. With login on, the admin page's Public site section sets all of it without a restart,
# and its values win over this file unless policy.locked names the key. Each text (imprint, privacy, accessibility, terms) is
# a link to a page you already have (url), a Markdown text written here (markdown), or a
# Markdown file read at start (file). With url set, markdown and file are ignored. A text
# is shown in the About dialog and at /site/<name> (no sign-in needed); the links appear
# in a small footer line of every page.
site:
  imprint:
    url: null          # an http://, https:// or mailto: address
    markdown: null     # the text itself, in safe Markdown (paragraphs, headings, lists, bold, italic, links, tables, code, quotes)
    file: null         # path of a Markdown file with the text (read at start, 256 KB at most)
    label: "Imprint"   # the link text; German sites: "Impressum"
  privacy:
    url: null
    markdown: null
    file: null
    label: "Privacy"   # German sites: "Datenschutz"
  accessibility:
    url: null
    markdown: null
    file: null
    label: "Accessibility"   # German sites: "Barrierefreiheit"
  terms:
    url: null
    markdown: null
    file: null
    label: "Terms of use"
  # Who runs this site, as one line: "Example Institute, University of X". Shown in About.
  operator: null
  # A contact for the site: an e-mail address or an http(s) address. Falls back to
  # branding.contact_info.email in About. A German imprint needs a second, fast way to reach you.
  contact: null
  # The link text for the contact in the footer and About; German sites: "Kontakt"
  contact_label: "Contact"
  # auto: a small footer line on every page links the texts above (and the contact; a server
  # other people reach also links About and Data & privacy, configured or not);
  # about-only: only the About dialog does (for internal sites; German and EU guidance
  # want imprint and privacy links visible on every page of a public one)
  footer_links: auto
  # Whether search engines may index the site: auto (not when login is on), index, noindex.
  # noindex adds X-Robots-Tag and a robots.txt that disallows everything.
  robots: auto
  # An address (mailto: or https) for vulnerability reports: serves /.well-known/security.txt
  security_contact: null
  # The language of the texts above (for security.txt and the text pages)
  languages: "en"
  # Whether the About dialog keeps AnnZarro's credit: the Setty Lab logo, the Setty Lab and Fred Hutch links,
  # the NIH funding statement and how to cite it. Hosters are welcome to keep it; false leaves
  # only the name, version, MIT licence and links to the documentation and repository.
  software_credits: true
  storage:
    # false: the layout autosave, the last sessions, the recent datasets and the dataset listings last only until
    # the tab closes (sessionStorage), so the browser keeps nothing between visits except
    # choices the user made (theme, pins, the search switches of Dataset information,
    # answers about external services; the subset size is kept for the tab in any case)
    persistent_convenience: true

# UI configuration
ui:
  # Panel type settings
  enabled_panel_types:
    - cell-plot
    - gene-plot
    - cell-table
    - gene-table
    - gene-set
  
  # Default visualization settings
  defaults:
    max_cells: 1000000
    max_genes: 1000000
    point_size: 5
    point_opacity: 1.0
    color_scale: "Portland"
    taxonomy_id: "9606"  # Homo sapiens
    # Datasets with more cells than subset_threshold open on a reproducible
    # subset of subset_size cells (seed subset_seed); the header shows it and
    # its dialog changes or removes it. Every panel shows the same cells.
    subset_threshold: 200000
    # A Cell Plot with more points than this is drawn in large-plot mode
    # (typed arrays; hover and click work, table filters, 3D and extra hover
    # columns do not); only reachable with
    # the subset off or larger than this. 1M keeps several regular plots
    # (400-900 B of browser heap per point) open side by side.
    large_plot_points: 1000000
    # A dataset with more cells than this does not download the names of the
    # cells it shows (a part of a 1B-cell store spread over every chunk of its
    # name column took 20-35 s to name at every step). Hover, focus and a
    # table's page ask for the names they show; sorting or searching a table
    # on the names, or exporting them, loads them once. Smaller datasets read
    # the names of their cells with the part.
    names_on_demand_above: 5000000
    # After a part is shown, read the next part's cells and embedding
    # coordinates in the background (low priority, dropped for any real
    # request), so stepping forward waits for little. auto: only on a
    # single-user server (a laptop, the desktop app); true / false force it.
    prefetch_next_part: auto
    subset_size: 100000
    subset_seed: 0

  # Browser memory guard. Before an action that needs memory in proportion
  # to the number of points (a new or duplicated Cell Plot, a larger subset
  # or every cell, a full-resolution image export, a recolour), the browser
  # predicts what it will need and compares it with what is left after the
  # open panels. A tab that runs out of memory is killed by the browser and
  # loses everything on screen. See docs/reference/configuration.md (ui.memory).
  memory:
    # off: never refuse; warn: say so beside the control and let it run;
    # block: disable the control and say why.
    enforce: block
    # JS heap the tab may use, in GB. null: what the browser reports
    # (Chrome: 4.4 GB on a 64-bit desktop), or 4.4 where it reports nothing.
    heap_gb: null
    # Everything the tab may hold (JS heap, typed arrays), in GB. null: for a
    # browser on this computer, its RAM less a reserve for the system and the
    # browser (a quarter, at least 4 GB); for a browser on another computer,
    # 16; at most half the device's memory on devices with 4 GB or less.
    total_gb: null
    # Array buffers one tab may hold, all its plots together, in GB (large-plot
    # mode keeps its points in them). null: the browser's own limit, 16.6 in
    # Chrome, Edge and the desktop app (measured); Safari ends a page at about
    # 15 on a computer with more than 16 GB, 7 below.
    buffers_gb: null
    # Predictions are multiplied by 1 + margin before they are compared.
    margin: 0.2

  # Client-side cache configuration
  cache:
    max_entries: 1000
    max_size_mb: 1024  # ~1GB
    
  # Autosave configuration
  autosave:
    enabled: true
    interval_ms: 10000
    storage_key: "annzarro_autosave"
    session_name: "Autosave"
    # List the last sessions (up to 3) first, on the welcome screen and in
    # Load Panel Set.
    show_in_list: true
    # When a page restores the autosave by itself: reload (a reload of the
    # tab, Back or Forward; a fresh visit lists it first and waits for
    # Restore), always (every visit) or never; true and false mean always and
    # never. A session that did not finish loading is never restored by itself.
    auto_restore: reload

# External API integrations
integrations:
  # Whether the Gene Set Analysis panel may send gene ids to external
  # services (STRING, g:Profiler, MyGene.info, ...): "ask" asks the user
  # first, once per service; "on" sends without asking (users agreed out of
  # band); "off" never sends anything (its Links still work); "none" sends
  # nothing and removes the Links too. Quote the
  # value: YAML reads a bare on/off as a boolean. The environment variable
  # ANNZARRO_EXTERNAL_REQUESTS overrides it.
  external_requests: "ask"
  gene_set:
    # adapter ids (string-enrichment) or service names (string) the panel
    # offers; null offers all of them
    services: null
    # per request attempt, in ms (each request is tried at most twice)
    timeout_ms: 20000
  string_db:
    # a versioned host, so results can be reproduced
    base_url: "https://version-12-5.string-db.org/api"
    version: "12.5"

# Policy registry: settings an administrator may change at run time
policy:
  # keys only this file decides (the admin settings and per-user overrides
  # are ignored for them), for example: [outbound.allow_external]
  locked: []
