# Annzarro Configuration Schema
# This file defines the schema for the configuration files.

# Schema metadata
__schema_version: "1.0.0"
__security_levels:
  - name: "public"
    description: "Information that can be safely shared with anyone, including frontend clients"
  - name: "internal"
    description: "Information that should only be available to the server components"
  - name: "sensitive"
    description: "Security-critical information that should be protected and never exposed via APIs"

# Server configuration
server:
  type: object
  description: Server configuration settings
  properties:
    host:
      type: string
      description: Host to bind to
      default: 127.0.0.1
      security: public
    port:
      type: integer
      description: Port to bind to
      default: 8000
      security: public
    unified_server: 
      type: boolean
      description: Whether to use the unified server approach
      default: true
      security: public
    cors_enabled:
      type: boolean
      description: Whether to enable CORS
      default: false
      security: internal
    cors_origins:
      type: string
      description: CORS origins to allow
      default: "*"
      security: internal
    https_enabled:
      type: boolean
      description: Whether to enable HTTPS
      default: false
      security: public
    cert_file:
      type: [string, "null"]
      description: Path to SSL certificate file
      default: null
      security: sensitive
    key_file:
      type: [string, "null"]
      description: Path to SSL key file
      default: null
      security: sensitive
    cross_origin_isolation:
      type: [string, boolean]
      enum: ["off", "on", "auto"]
      description: Send COOP/COEP headers so the browser can measure the page's memory; auto = on unless the page is loaded in a frame
      default: off
      security: internal
    url_prefix:
      type: string
      description: "Path the app is served under behind a reverse proxy, e.g. /explore (empty = the root)"
      default: ""
      security: public
    data_dir:
      type: string
      description: Data directory
      default: "~/annzarro-data"
      security: internal  # an absolute server path; the client does not need it
    allowed_dirs:
      type: array
      items:
        type: string
      description: Directories beyond data_dir that dataset paths may resolve into on a confined server
      default: []
      security: internal
    workers:
      type: integer
      description: gunicorn worker processes (annzarro/server/gunicorn_config.py); each keeps its own dataset cache
      default: 4
      security: internal
    threads:
      type: integer
      description: gunicorn threads per worker (gthread worker class)
      default: 4
      security: internal
    arbitrary_paths:
      type: string
      enum: [admins, local-only, none]
      description: "Who may open dataset paths outside data_dir/allowed_dirs: admins = admins of a shared server (logged) and the user of a local single-user server; local-only = only that local user; none = nobody"
      default: admins
      security: internal
    static_dir:
      type: [string, "null"]
      description: Static files directory
      default: null
      security: internal
    log_file:
      type: string
      description: Log file path
      default: annzarro_server.log
    log_level:
      type: string
      description: Log level
      enum: [DEBUG, INFO, WARNING, ERROR, CRITICAL]
      default: INFO
    max_response_elements:
      type: integer
      description: Maximum number of elements in an array response
      default: 10000000
    compress_responses:
      type: [boolean, string]
      description: gzip JSON responses (level 1); auto compresses only on a shared server (login on or a network host)
      default: auto
    cache_enabled:
      type: boolean
      description: Whether to enable caching
      default: true
    cache_memory_mb:
      type: integer
      description: Maximum memory in MB for caching
      default: 1000
    cache_dataset_limit:
      type: integer
      description: Maximum number of datasets to keep in memory
      default: 10
    name_index_max_mb:
      type: [number, "null"]
      description: MB the name-search indices may hold together per worker; null = 15% of RAM (512 MB to 16 GB). A larger dataset is searched by scanning its names
      default: null
    name_search_scan_names:
      type: integer
      description: Names a name search without an index reads at most before answering with a partial result
      default: 100000000
    dataset_folder_max_entries:
      type: integer
      description: Entries (folders and stores) one request of the dataset picker's folder listing returns; a larger folder is read in pages with "show more"
      default: 500
    dataset_search_max_depth:
      type: integer
      description: Folders deep the dataset picker's search of the data directory goes
      default: 6
    dataset_details_check_budget_s:
      type: number
      minimum: 0
      description: Seconds the dataset browser's details request spends on the store check of one zarr store before it answers with the findings so far; 0 turns the check off there
      default: 1.5
    dataset_search_max_entries:
      type: integer
      description: Entries the dataset picker's search of the data directory looks at before it stops and says the result is partial
      default: 20000
    name_search_max_regex_chars:
      type: integer
      minimum: 1
      description: Longest regular expression a name search (mode=regex) runs, in characters; a longer one is a 400 regex_too_long
      default: 200
    name_search_timeout_s:
      type: number
      minimum: 0
      description: Seconds a regex name search scans before it answers with the matches found so far (partial); 0 = no limit
      default: 10
    read_user_share_percent:
      type: number
      minimum: 0
      maximum: 100
      description: Percent of read_budget_mb one user (login off - one client address) may hold of pairwise reads at once; never less than one max_read_mb read; 0 = no share
      default: 50
    subset_budget_mb:
      type: [number, "null"]
      minimum: 1
      description: MB the cell subsets one worker computes at once may hold, each charged 55 bytes per cell of its dataset; null = 15% of RAM. A subset larger than the whole budget runs alone
      default: null
    subset_wait_s:
      type: number
      minimum: 0
      description: Seconds a subset waits for subset_budget_mb before answering 503 read_busy with Retry-After
      default: 30
    max_requests:
      type: integer
      minimum: 0
      description: gunicorn replaces a worker after this many requests (frees creeping memory, empties its caches); 0 = never
      default: 20000
    max_requests_jitter:
      type: integer
      minimum: 0
      description: gunicorn adds up to this many random extra requests per worker so workers do not restart together
      default: 2000
    limit_request_line:
      type: integer
      minimum: 0
      description: gunicorn's longest request line in bytes; 0 = unlimited (the reverse proxy bounds it); gunicorn caps any other value at 8190
      default: 0
    limit_request_fields:
      type: integer
      minimum: 0
      description: gunicorn's most header fields per request
      default: 100
    limit_request_field_size:
      type: integer
      minimum: 0
      description: gunicorn's longest header field in bytes
      default: 8190
    max_request_mb:
      type: number
      minimum: 0
      description: Largest request body in MB (panel-set saves and imports); a larger one is a 413 request_too_large; 0 = no limit
      default: 64
    max_sessions_per_user:
      type: integer
      minimum: 0
      description: Panel sets one user may keep (with login off all sets are one user's); a save past it is a 409 session_quota_user; 0 = no limit
      default: 500
    max_sessions:
      type: integer
      minimum: 0
      description: Panel sets the whole server keeps; a save past it is a 409 session_quota_total; 0 = no limit
      default: 5000
    max_sessions_mb:
      type: number
      minimum: 0
      description: MB all panel sets may take together; a save past it is a 409 session_quota_total; 0 = no limit
      default: 256
    lock_timeout_s:
      type: number
      minimum: 0.1
      description: Seconds a request waits for the lock on the users file or the admin state before it answers 503 busy
      default: 10
      security: internal
    admin_data_roots:
      type: array
      items:
        type: string
      description: Directories inside which an admin may add data directories in the browser; empty = adding is off. Keep them writable by trusted accounts only, since whoever can write there can swap a directory for a link between the check and the read
      default: []
      security: internal
    admin_reauth_minutes:
      type: number
      minimum: 0
      description: Minutes an admin's password entry lets them change things in the admin interface; 0 = never asked
      default: 30
      security: internal
    admin_rate_per_minute:
      type: number
      minimum: 1
      description: Admin changes per minute per admin and gunicorn worker (reads get eight times as many); over it 429 admin_rate_limited
      default: 30
      security: internal
    admin_audit_max_mb:
      type: number
      minimum: 0
      description: MB at which the admin audit log rotates (five rotations are kept); 0 = never
      default: 50
      security: internal
    dataset_scan_max_entries:
      type: integer
      minimum: 1
      description: Directory entries the legacy dataset listing and the /status store count read before they stop (a store's chunk files are never walked); the listing then says truncated
      default: 200000
    max_read_mb:
      type: [number, "null"]
      description: MB one read of an obsp/varp matrix may hold in memory, estimated from metadata before reading; over it the request is a 413 read_too_large. null = 5% of RAM (256 MB to 4 GB); applies to admins too
      default: null
    max_names_json_mb:
      type: [number, "null"]
      description: MB a reply of every cell or gene name may hold when built whole, estimated at 170 bytes a name before reading; over it the request is a 413 read_too_large. Only readers that cannot stream (h5ad, an index stored as a categorical) are limited; a zarr store streams its names a chunk at a time, a cell subset too, and has no limit. 0 or null = no limit
      default: 2048
    names_stream_max_concurrent:
      type: integer
      description: Streams of every cell or gene name one worker sends at once; each holds a server thread until its client has read the reply, so a slow reader cannot take them all. One more is answered 503 read_busy with Retry-After before any byte is sent. 0 = no limit
      default: 2
    names_stream_slot_above:
      type: integer
      description: Names an axis must have for its stream to count against names_stream_max_concurrent; shorter lists (every dataset open reads one) are streamed without a slot
      default: 1000000
    read_budget_mb:
      type: [number, "null"]
      description: MB all obsp/varp reads in flight in one worker may hold together; null = twice max_read_mb. A read that does not fit waits read_wait_s, then 503 read_busy
      default: null
    read_wait_s:
      type: number
      description: Seconds an obsp/varp read waits for read_budget_mb before answering 503 read_busy with Retry-After
      default: 5
    refresh_min_interval_s:
      type: number
      description: Seconds between two walks of one dataset by POST /data/refresh (open to every user)
      default: 10
    remote_stores:
      type: string
      enum: [auto, allow, deny]
      description: Whether remote (s3/gs/http) zarr datasets may be opened; auto allows them only on a local single-user server
      default: auto
      security: internal
    remote_allowlist:
      type: array
      items:
        type: string
      description: URL prefixes remote datasets must start with; enables remote stores on hosted servers under auto
      default: []
      security: internal
    remote_credentials:
      type: string
      enum: [anonymous, environment]
      description: Credentials for remote stores; environment uses the AWS/GCP standard credential chain
      default: anonymous
      security: internal
    remote_connect_timeout_s:
      type: number
      description: Seconds to establish a connection to a remote store
      default: 10
      security: internal
    remote_read_timeout_s:
      type: number
      description: Seconds to wait between bytes from a remote store before failing with 504
      default: 30
      security: internal
    remote_request_timeout_s:
      type: number
      description: Seconds one request may spend on remote reads in total before 504 remote_deadline; null = 120 on a hosted server, 600 on a single-user one; 0 = no limit
      default: null
      security: internal
    remote_chunk_cache_mb:
      type: integer
      description: In-memory LRU of raw chunk bytes per open remote store (zarr 3 only); 0 disables
      default: 256
      security: internal
  required:
    - host
    - port
    - data_dir

# Authentication configuration
auth:
  type: object
  description: Authentication settings
  properties:
    enabled:
      type: boolean
      description: Whether to enable authentication
      default: false
      security: public
    user_file:
      type: string
      description: Path to user file
      default: "config/auth/users.json"
      security: internal
    secret_key:
      type: string
      description: Secret key for sessions
      default: null  # generated and stored beside user_file; shipped placeholders are refused
      security: sensitive
    session_timeout:
      type: integer
      description: Seconds of inactivity after which a login expires (0 = never)
      default: 28800
      security: internal
    cookie_secure:
      type: string
      description: "Secure flag on the login cookie: auto (when the request came over HTTPS, as seen through proxy_count proxies), true or false"
      default: auto
      security: internal
  required:
    - enabled

# Branding configuration
branding:
  type: object
  description: Application branding settings
  security: public
  properties:
    app_name:
      type: string
      description: Application name
      default: AnnZarro
      security: public
    project_description:
      type: string
      description: Project description
      default: Zarr-based AnnData Visualization Tool
      security: public
    contact_info:
      type: object
      description: Contact information shown on login page
      security: public
      properties:
        lab_name:
          type: [string, "null"]
          description: Name of the lab or organization
          default: null
        lab_url:
          type: [string, "null"]
          description: URL of the lab or organization website
          default: null
        email:
          type: [string, "null"]
          description: Contact email address
          default: null
        custom_html:
          type: [string, "null"]
          description: Custom HTML content for additional contact information
          default: null
  required:
    - app_name

# UI configuration
ui:
  type: object
  description: UI settings
  security: public   # the browser reads these
  properties:
    enabled_panel_types:
      type: array
      description: List of enabled panel types
      items:
        type: string
        enum: [cell-plot, gene-plot, cell-table, gene-table, gene-set]
      default: [cell-plot, gene-plot, cell-table, gene-table, gene-set]
    defaults:
      type: object
      description: Default UI settings
      properties:
        max_cells:
          type: integer
          description: Maximum number of cells to display
          default: 10000
        max_genes:
          type: integer
          description: Maximum number of genes to display
          default: 10000
        point_size:
          type: number
          description: Default point size
          default: 5
        point_opacity:
          type: number
          description: Default point opacity
          default: 1.0
        color_scale:
          type: string
          description: Default color scale
          default: Portland
        taxonomy_id:
          type: string
          description: Default taxonomy ID
          default: "9606"
        large_plot_points:
          type: integer
          description: A Cell Plot with more points than this is drawn in large-plot mode (no hover, click or table filter)
          default: 1000000
        names_on_demand_above:
          type: integer
          description: A dataset with more cells than this does not download the names of the cells it shows; hover, focus and a table's page ask for the names they need
          default: 5000000
        prefetch_next_part:
          type: [string, boolean]
          description: Read the next part's cells and embedding coordinates in the background after a part is shown (auto - single-user servers only, true, false)
          default: auto
        subset_threshold:
          type: integer
          description: A dataset with more cells than this opens on a reproducible cell subset (0 = always)
          default: 200000
        subset_size:
          type: integer
          description: Cells in that subset
          default: 100000
        subset_seed:
          type: integer
          description: Seed of that subset (same seed, same cells)
          default: 0
    memory:
      type: object
      description: Browser memory guard (predicts what an action needs and refuses one that would crash the tab)
      properties:
        enforce:
          type: string
          enum: ["off", "warn", "block"]
          description: "What happens when an action does not fit: off (nothing), warn (say so, let it run), block (disable it and say why)"
          default: block
        heap_gb:
          type: [number, "null"]
          description: JS heap the tab may use, in GB; null = the browser's own limit (4.4 GB where it reports none)
          default: null
        total_gb:
          type: [number, "null"]
          description: Everything the tab may hold (JS heap and typed arrays), in GB; null = this computer's RAM less a quarter (at least 4 GB) for a browser on the server's computer, 16 for any other, at most half of a device with 4 GB or less
          default: null
        margin:
          type: number
          description: Safety margin; predictions are multiplied by 1 + margin
          default: 0.2
    cache:
      type: object
      description: Client-side cache settings
      properties:
        max_entries:
          type: integer
          description: Maximum number of cache entries
          default: 1000
        max_size_mb:
          type: integer
          description: Maximum cache size in MB
          default: 1024
    autosave:
      type: object
      description: Autosave settings
      properties:
        enabled:
          type: boolean
          description: Whether to enable autosave
          default: true
        interval_ms:
          type: integer
          description: Autosave interval in milliseconds
          default: 10000
        storage_key:
          type: string
          description: Local storage key for autosaved session
          default: annzarro_autosave
        session_name:
          type: string
          description: Default name for autosaved sessions
          default: Autosave
        show_in_list:
          type: boolean
          description: Whether to show autosave in session lists
          default: false
        auto_restore:
          type: boolean
          description: Whether to automatically restore autosave on startup
          default: true
  required:
    - defaults

# External integrations
integrations:
  type: object
  description: External API integrations
  security: public   # the browser calls these APIs itself
  properties:
    external_requests:
      type: string
      enum: [ask, "on", "off", none]
      description: >-
        Whether the Gene Set Analysis panel may send gene ids to external
        services: ask (the user, once per service), on (without asking),
        off (never; its Links still work) or none (never, and no Links).
        Overridden by the ANNZARRO_EXTERNAL_REQUESTS
        environment variable.
      default: ask
    gene_set:
      type: object
      description: The Gene Set Analysis panel's external services
      properties:
        services:
          type: [array, "null"]
          items:
            type: string
          description: Adapter ids or service names offered (null for all)
          default: null
        timeout_ms:
          type: integer
          description: Timeout of one request attempt, in ms
          default: 20000
    string_db:
      type: object
      description: StringDB API integration
      properties:
        base_url:
          type: string
          description: StringDB API base URL (a versioned host)
          default: https://version-12-5.string-db.org/api
        version:
          type: string
          description: StringDB API version
          default: "12.5"
# The policy registry (annzarro/server/policy)
policy:
  type: object
  description: Settings an administrator may change at run time (the policy registry)
  security: internal
  properties:
    locked:
      type: array
      items:
        type: string
      description: >-
        Policy keys (for example panel.gene-set.enabled) only this file decides.
        The admin settings and per-user overrides are ignored for them.
      default: []
