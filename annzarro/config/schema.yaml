# Annzarro Configuration Schema
# This file defines the schema for the configuration files.

# Schema metadata
__schema_version: "1.0.0"
__security_levels:
  - name: "public"
    description: "Information that can be safely shared with anyone, including frontend clients"
  - name: "internal"
    description: "Information that should only be available to the server components"
  - name: "sensitive"
    description: "Security-critical information that should be protected and never exposed via APIs"

# Server configuration
server:
  type: object
  description: Server configuration settings
  properties:
    host:
      type: string
      description: Host to bind to
      default: 127.0.0.1
      security: public
    port:
      type: integer
      description: Port to bind to
      default: 8000
      security: public
    unified_server: 
      type: boolean
      description: Whether to use the unified server approach
      default: true
      security: public
    cors_enabled:
      type: boolean
      description: Whether to enable CORS
      default: false
      security: internal
    cors_origins:
      type: string
      description: CORS origins to allow
      default: "*"
      security: internal
    https_enabled:
      type: boolean
      description: Whether to enable HTTPS
      default: false
      security: public
    cert_file:
      type: [string, "null"]
      description: Path to SSL certificate file
      default: null
      security: sensitive
    key_file:
      type: [string, "null"]
      description: Path to SSL key file
      default: null
      security: sensitive
    cross_origin_isolation:
      type: [string, boolean]
      enum: ["off", "on", "auto"]
      description: Send COOP/COEP headers so the browser can measure the page's memory; auto = on unless the page is loaded in a frame
      default: off
      security: internal
    url_prefix:
      type: string
      description: "Path the app is served under behind a reverse proxy, e.g. /explore (empty = the root)"
      default: ""
      security: public
    data_dir:
      type: string
      description: Data directory
      default: "~/annzarro-data"
      security: internal  # an absolute server path; the client does not need it
    allowed_dirs:
      type: array
      items:
        type: string
      description: Directories beyond data_dir that dataset paths may resolve into on a confined server
      default: []
      security: internal
    arbitrary_paths:
      type: string
      enum: [auto, admins, none]
      description: "Who may open dataset paths outside data_dir/allowed_dirs: auto = only the user of a local single-user server; admins = also admins of a shared server; none = nobody"
      default: auto
      security: internal
    static_dir:
      type: [string, "null"]
      description: Static files directory
      default: null
      security: internal
    log_file:
      type: string
      description: Log file path
      default: annzarro_server.log
    log_level:
      type: string
      description: Log level
      enum: [DEBUG, INFO, WARNING, ERROR, CRITICAL]
      default: INFO
    max_response_elements:
      type: integer
      description: Maximum number of elements in an array response
      default: 10000000
    compress_responses:
      type: [boolean, string]
      description: gzip JSON responses (level 1); auto compresses only on a shared server (login on or a network host)
      default: auto
    cache_enabled:
      type: boolean
      description: Whether to enable caching
      default: true
    cache_memory_mb:
      type: integer
      description: Maximum memory in MB for caching
      default: 1000
    cache_dataset_limit:
      type: integer
      description: Maximum number of datasets to keep in memory
      default: 10
    refresh_min_interval_s:
      type: number
      description: Seconds between two walks of one dataset by POST /data/refresh (open to every user)
      default: 10
    remote_stores:
      type: string
      enum: [auto, allow, deny]
      description: Whether remote (s3/gs/http) zarr datasets may be opened; auto allows them only on a local single-user server
      default: auto
      security: internal
    remote_allowlist:
      type: array
      items:
        type: string
      description: URL prefixes remote datasets must start with; enables remote stores on hosted servers under auto
      default: []
      security: internal
    remote_credentials:
      type: string
      enum: [anonymous, environment]
      description: Credentials for remote stores; environment uses the AWS/GCP standard credential chain
      default: anonymous
      security: internal
    remote_connect_timeout_s:
      type: number
      description: Seconds to establish a connection to a remote store
      default: 10
      security: internal
    remote_read_timeout_s:
      type: number
      description: Seconds to wait between bytes from a remote store before failing with 504
      default: 30
      security: internal
    remote_chunk_cache_mb:
      type: integer
      description: In-memory LRU of raw chunk bytes per open remote store (zarr 3 only); 0 disables
      default: 256
      security: internal
  required:
    - host
    - port
    - data_dir

# Authentication configuration
auth:
  type: object
  description: Authentication settings
  properties:
    enabled:
      type: boolean
      description: Whether to enable authentication
      default: false
      security: public
    user_file:
      type: string
      description: Path to user file
      default: "config/auth/users.json"
      security: internal
    secret_key:
      type: string
      description: Secret key for sessions
      default: null  # generated and stored beside user_file; shipped placeholders are refused
      security: sensitive
    session_timeout:
      type: integer
      description: Seconds of inactivity after which a login expires (0 = never)
      default: 28800
      security: internal
    cookie_secure:
      type: string
      description: "Secure flag on the login cookie: auto (when the request came over HTTPS, as seen through proxy_count proxies), true or false"
      default: auto
      security: internal
  required:
    - enabled

# Branding configuration
branding:
  type: object
  description: Application branding settings
  security: public
  properties:
    app_name:
      type: string
      description: Application name
      default: AnnZarro
      security: public
    project_description:
      type: string
      description: Project description
      default: Zarr-based AnnData Visualization Tool
      security: public
    contact_info:
      type: object
      description: Contact information shown on login page
      security: public
      properties:
        lab_name:
          type: [string, "null"]
          description: Name of the lab or organization
          default: null
        lab_url:
          type: [string, "null"]
          description: URL of the lab or organization website
          default: null
        email:
          type: [string, "null"]
          description: Contact email address
          default: null
        custom_html:
          type: [string, "null"]
          description: Custom HTML content for additional contact information
          default: null
  required:
    - app_name

# UI configuration
ui:
  type: object
  description: UI settings
  security: public   # the browser reads these
  properties:
    enabled_panel_types:
      type: array
      description: List of enabled panel types
      items:
        type: string
        enum: [cell-plot, gene-plot, cell-table, gene-table, gene-set]
      default: [cell-plot, gene-plot, cell-table, gene-table, gene-set]
    defaults:
      type: object
      description: Default UI settings
      properties:
        max_cells:
          type: integer
          description: Maximum number of cells to display
          default: 10000
        max_genes:
          type: integer
          description: Maximum number of genes to display
          default: 10000
        point_size:
          type: number
          description: Default point size
          default: 5
        point_opacity:
          type: number
          description: Default point opacity
          default: 1.0
        color_scale:
          type: string
          description: Default color scale
          default: Portland
        taxonomy_id:
          type: string
          description: Default taxonomy ID
          default: "9606"
        large_plot_points:
          type: integer
          description: A Cell Plot with more points than this is drawn in large-plot mode (no hover, click or table filter)
          default: 1000000
        subset_threshold:
          type: integer
          description: A dataset with more cells than this opens on a reproducible cell subset (0 = always)
          default: 200000
        subset_size:
          type: integer
          description: Cells in that subset
          default: 100000
        subset_seed:
          type: integer
          description: Seed of that subset (same seed, same cells)
          default: 0
    memory:
      type: object
      description: Browser memory guard (predicts what an action needs and refuses one that would crash the tab)
      properties:
        enforce:
          type: string
          enum: ["off", "warn", "block"]
          description: "What happens when an action does not fit: off (nothing), warn (say so, let it run), block (disable it and say why)"
          default: block
        heap_gb:
          type: [number, "null"]
          description: JS heap the tab may use, in GB; null = the browser's own limit (4.4 GB where it reports none)
          default: null
        total_gb:
          type: [number, "null"]
          description: Everything the tab may hold (JS heap and typed arrays), in GB; null = no limit except on devices with 4 GB or less
          default: null
        margin:
          type: number
          description: Safety margin; predictions are multiplied by 1 + margin
          default: 0.2
    cache:
      type: object
      description: Client-side cache settings
      properties:
        max_entries:
          type: integer
          description: Maximum number of cache entries
          default: 1000
        max_size_mb:
          type: integer
          description: Maximum cache size in MB
          default: 1024
    autosave:
      type: object
      description: Autosave settings
      properties:
        enabled:
          type: boolean
          description: Whether to enable autosave
          default: true
        interval_ms:
          type: integer
          description: Autosave interval in milliseconds
          default: 10000
        storage_key:
          type: string
          description: Local storage key for autosaved session
          default: annzarro_autosave
        session_name:
          type: string
          description: Default name for autosaved sessions
          default: Autosave
        show_in_list:
          type: boolean
          description: Whether to show autosave in session lists
          default: false
        auto_restore:
          type: boolean
          description: Whether to automatically restore autosave on startup
          default: true
  required:
    - defaults

# External integrations
integrations:
  type: object
  description: External API integrations
  security: public   # the browser calls these APIs itself
  properties:
    external_requests:
      type: string
      enum: [ask, "on", "off"]
      description: >-
        Whether the Gene Set Analysis panel may send gene ids to external
        services: ask (the user, once per service), on (without asking) or
        off (never). Overridden by the ANNZARRO_EXTERNAL_REQUESTS
        environment variable.
      default: ask
    gene_set:
      type: object
      description: The Gene Set Analysis panel's external services
      properties:
        services:
          type: [array, "null"]
          items:
            type: string
          description: Adapter ids or service names offered (null for all)
          default: null
        timeout_ms:
          type: integer
          description: Timeout of one request attempt, in ms
          default: 20000
    string_db:
      type: object
      description: StringDB API integration
      properties:
        base_url:
          type: string
          description: StringDB API base URL (a versioned host)
          default: https://version-12-5.string-db.org/api
        version:
          type: string
          description: StringDB API version
          default: "12.5"