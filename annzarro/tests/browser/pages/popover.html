<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pop-over test page</title>
<link rel="stylesheet" href="/static/vendor/css/bootstrap.min.css">
<link rel="stylesheet" href="/static/css/theme.css">
<link rel="stylesheet" href="/static/css/styles.css">
<link rel="stylesheet" href="/static/css/popover.css">
<style>
  body { margin: 0; }
  #tile { width: 300px; height: 200px; margin: 20px; border: 1px solid #888; display: flex; flex-direction: column; overflow: auto; }
  #tile .row { flex: 1 1 auto; min-height: 60px; }
  #far { position: absolute; left: 700px; top: 20px; }
  #outside { position: absolute; left: 700px; top: 120px; }
</style>
</head>
<body>
<div id="tile" data-testid="tile">
  <div><button id="a1" type="button" class="btn btn-sm btn-outline-secondary">Options</button>
       <button id="a2" type="button" class="btn btn-sm btn-outline-secondary">Other</button>
       <button id="m1" type="button" class="btn btn-sm btn-outline-secondary">Add</button></div>
  <div class="row" id="plot">plot</div>
</div>
<button id="far" type="button">far</button>
<button id="outside" type="button">outside</button>
<script type="module">
import { createPopover } from '/static/js/ui/popover.js';
window.closes = [];
const fill = (body) => {
    body.innerHTML = '<label>Size <input id="p-text" type="text" value="hello world"></label>'
        + '<input id="p-range" type="range" min="0" max="10" value="5" style="width:200px">'
        + '<button id="p-b1" type="button">One</button><button id="p-b2" type="button">Two</button>';
};
window.pops = {
    a1: createPopover({ anchor: document.getElementById('a1'), name: 'plot-options', title: 'Plot Options',
        render: fill, onClose: (r) => window.closes.push(['a1', r]) }),
    a2: createPopover({ anchor: document.getElementById('a2'), name: 'color', title: 'Color', wide: true,
        render: fill, onClose: (r) => window.closes.push(['a2', r]) }),
    m1: createPopover({ anchor: document.getElementById('m1'), name: 'add', title: 'Add', menu: true,
        render: (body) => { body.innerHTML = '<button role="menuitem" id="mi1">Genes</button><button role="menuitem" id="mi2">Factor</button>'; },
        onClose: (r) => window.closes.push(['m1', r]) })
};
window.ready = true;
</script>
</body>
</html>
