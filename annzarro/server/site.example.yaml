# AnnZarro site configuration for a hosted (gunicorn) server.
#
# Copy to /etc/annzarro/site.yaml and point ANNZARRO_CONFIG at it (the systemd
# unit and run_gunicorn.sh do). It is layered over the built-in defaults
# (annzarro/config/base.yaml + production.yaml), so list only what differs.
# `annzarro config show --config /etc/annzarro/site.yaml` (or with
# ANNZARRO_CONFIG set, plain `annzarro config show`) prints the merged result
# and where each value came from; `annzarro user ...` uses the same file.

server:
  # gunicorn binds here; keep it on loopback behind a TLS reverse proxy
  host: 127.0.0.1
  port: 8000
  # The datasets. AnnZarro only reads here (it can be mounted read-only); every dataset
  # opened must resolve inside data_dir or allowed_dirs
  data_dir: /srv/annzarro/data
  # allowed_dirs: [/srv/shared/atlases]
  # Everything AnnZarro writes: panel sets, users, admin settings, logs, caches. It must lie
  # outside the data directories. The systemd unit's StateDirectory=annzarro makes it
  # /var/lib/annzarro and sets $STATE_DIRECTORY, which is used when this key is not set.
  state_dir: /var/lib/annzarro
  # Panel sets (default <state_dir>/panel-sets). An install whose panel sets are still in
  # <data_dir>/sessions keeps using that folder until `annzarro panel-sets migrate` copies them.
  # panel_sets_dir: /var/lib/annzarro/panel-sets
  # Disposable caches, safe to delete and to leave out of backups (default <state_dir>/cache;
  # $CACHE_DIRECTORY under systemd's CacheDirectory=).
  # cache_dir: /var/cache/annzarro
  # Reverse proxies in front whose X-Forwarded-* headers are trusted
  # (client address, and https for the Secure login cookie). 0 without one.
  proxy_count: 1
  # Served under a path, e.g. https://lab.example.org/explore/ (empty = the root).
  # The proxy may strip the prefix or pass it on; see the nginx example in the docs.
  # url_prefix: /explore
  # Each gunicorn worker keeps its own cache of up to cache_memory_mb
  workers: 4
  # Threads per worker (gthread): requests served at once = workers x threads
  threads: 4
  log_file: /var/log/annzarro/server.log

auth:
  # Login is on by default under gunicorn. Users: `annzarro user add --admin`.
  # The login cookie key is generated beside this file on first start.
  user_file: /var/lib/annzarro/auth/users.json
  # session_timeout: 28800   # seconds idle before a login expires; 0 = never
  # cookie_secure: auto      # Secure cookie when the request came over HTTPS

# A public site owes its visitors an imprint and a privacy notice (docs/deployment/public-site.md).
# Each text is a link (url), a Markdown text (markdown) or a Markdown file (file); a small footer
# line on every page links them.
# site:
#   operator: "Example Institute, University of X"
#   contact: "atlas@example.org"
#   imprint:
#     url: "https://www.example.org/imprint"
#   privacy:
#     file: /etc/annzarro/privacy.md
#   robots: auto            # not indexed while login is on
#   security_contact: "mailto:security@example.org"

# Shown on the login page only when set
# branding:
#   contact_info:
#     lab_name: "Example Lab"
#     lab_url: "https://lab.example.org"
#     email: "annzarro-admin@example.org"
